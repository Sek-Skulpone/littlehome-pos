<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>สั่งเครื่องดื่ม - Little Homie Coffee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        coffee: {
                            50: '#fdf8f6', 100: '#f2e8e5', 200: '#e8d5ce', 300: '#d3b2a7',
                            400: '#b78776', 500: '#9c6252', 600: '#874f41', 700: '#703e33',
                            800: '#5c342b', 900: '#4c2d26', 950: '#281512',
                        },
                        amberGold: '#d97706',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f7f3f0;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }
        .pop-in { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .slide-up { animation: slideUp 0.25s ease-out; }
        @keyframes slideUp {
            0% { transform: translateY(16px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 antialiased min-h-screen">
    <div id="root"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2U4eZyXhKjkPG3Ow8jgaMoKEOGYfknDQ",
            authDomain: "littlehome-pos.firebaseapp.com",
            projectId: "littlehome-pos",
            storageBucket: "littlehome-pos.firebasestorage.app",
            messagingSenderId: "763353161948",
            appId: "1:763353161948:web:37eaa7c9b312acbb069419"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_MENU = [
            { name: 'อเมริกาโน่', category: 'กาแฟ', price: 45, available: true, sortOrder: 1 },
            { name: 'เอสเพรสโซ่', category: 'กาแฟ', price: 45, available: true, sortOrder: 2 },
            { name: 'ลาเต้', category: 'กาแฟ', price: 55, available: true, sortOrder: 3 },
            { name: 'คาปูชิโน่', category: 'กาแฟ', price: 55, available: true, sortOrder: 4 },
            { name: 'มอคค่า', category: 'กาแฟ', price: 60, available: true, sortOrder: 5 },
            { name: 'คาราเมล มัคคิอาโต้', category: 'กาแฟ', price: 65, available: true, sortOrder: 6 },
            { name: 'ชาไทย', category: 'เครื่องดื่มอื่นๆ', price: 45, available: true, sortOrder: 7 },
            { name: 'ชาเขียวนม', category: 'เครื่องดื่มอื่นๆ', price: 50, available: true, sortOrder: 8 },
            { name: 'ช็อกโกแลต', category: 'เครื่องดื่มอื่นๆ', price: 55, available: true, sortOrder: 9 },
            { name: 'นมสดปั่น', category: 'เครื่องดื่มอื่นๆ', price: 50, available: true, sortOrder: 10 },
            { name: 'ครัวซองต์', category: 'เบเกอรี่', price: 45, available: true, sortOrder: 11 },
            { name: 'บราวนี่', category: 'เบเกอรี่', price: 40, available: true, sortOrder: 12 },
            { name: 'คุกกี้', category: 'เบเกอรี่', price: 35, available: true, sortOrder: 13 },
        ];

        const CATEGORY_ICONS = {
            'กาแฟ': 'coffee',
            'เครื่องดื่มอื่นๆ': 'cup-soda',
            'เบเกอรี่': 'cake',
        };

        const STATUS_STEPS = [
            { key: 'new', label: 'รับออเดอร์แล้ว', icon: 'receipt' },
            { key: 'preparing', label: 'กำลังทำ', icon: 'loader' },
            { key: 'ready', label: 'พร้อมรับแล้ว', icon: 'check-check' },
        ];

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'tap') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                    osc.start(); osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'ready') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.setValueAtTime(1046.5, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) { /* audio not available yet */ }
        };

        const formatPhone = (val) => {
            if (!val) return '';
            const clean = val.replace(/\D/g, '');
            if (clean.length <= 3) return clean;
            if (clean.length <= 6) return `${clean.slice(0, 3)}-${clean.slice(3)}`;
            return `${clean.slice(0, 3)}-${clean.slice(3, 6)}-${clean.slice(6, 10)}`;
        };

        // Atomically claims the next daily order number so customers see a short, friendly code.
        async function getNextOrderNumber() {
            const today = new Date();
            const dayKey = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
            const ref = db.collection('counters').doc(dayKey);
            const next = await db.runTransaction(async (t) => {
                const snap = await t.get(ref);
                const current = snap.exists ? snap.data().count : 0;
                const value = current + 1;
                t.set(ref, { count: value });
                return value;
            });
            return next;
        }

        function App() {
            const [menu, setMenu] = useState([]);
            const [menuLoaded, setMenuLoaded] = useState(false);
            const [cart, setCart] = useState({}); // { [menuId]: qty }
            const [view, setView] = useState('menu'); // 'menu' | 'checkout' | 'confirm'
            const [submitting, setSubmitting] = useState(false);
            const [notification, setNotification] = useState(null);
            const [placedOrder, setPlacedOrder] = useState(null);
            const [orderType, setOrderType] = useState('dine-in');
            const [tableNumber, setTableNumber] = useState('');
            const [customerName, setCustomerName] = useState('');
            const [phone, setPhone] = useState('');
            const [note, setNote] = useState('');
            const lastReadyRef = useRef(null);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const showToast = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 2500);
            };

            // Load menu live; seed defaults once if the shop hasn't set any up yet.
            useEffect(() => {
                let seeded = false;
                const unsub = db.collection('menu').orderBy('sortOrder').onSnapshot((snap) => {
                    if (snap.empty && !seeded) {
                        seeded = true;
                        const batch = db.batch();
                        DEFAULT_MENU.forEach((item) => {
                            const ref = db.collection('menu').doc();
                            batch.set(ref, item);
                        });
                        batch.commit().catch(() => {});
                        return;
                    }
                    setMenu(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setMenuLoaded(true);
                }, () => setMenuLoaded(true));
                return unsub;
            }, []);

            const grouped = useMemo(() => {
                const byCat = {};
                menu.forEach(item => {
                    if (!byCat[item.category]) byCat[item.category] = [];
                    byCat[item.category].push(item);
                });
                return byCat;
            }, [menu]);

            const cartItems = useMemo(() => {
                return Object.entries(cart)
                    .filter(([, qty]) => qty > 0)
                    .map(([menuId, qty]) => {
                        const item = menu.find(m => m.id === menuId);
                        return item ? { menuId, name: item.name, price: item.price, qty } : null;
                    })
                    .filter(Boolean);
            }, [cart, menu]);

            const cartCount = cartItems.reduce((sum, i) => sum + i.qty, 0);
            const cartTotal = cartItems.reduce((sum, i) => sum + i.qty * i.price, 0);

            const changeQty = (menuId, delta) => {
                playSound('tap');
                setCart(prev => {
                    const next = { ...prev };
                    const current = next[menuId] || 0;
                    next[menuId] = Math.max(0, current + delta);
                    return next;
                });
            };

            const handleSubmitOrder = async () => {
                if (cartItems.length === 0 || !customerName.trim()) return;
                if (orderType === 'dine-in' && !tableNumber.trim()) {
                    showToast('กรุณาระบุเลขโต๊ะ', 'error');
                    return;
                }
                setSubmitting(true);
                try {
                    const orderNumber = await getNextOrderNumber();
                    const docRef = await db.collection('orders').add({
                        orderNumber,
                        items: cartItems.map(({ menuId, name, price, qty }) => ({ menuId, name, price, qty })),
                        total: cartTotal,
                        orderType,
                        tableNumber: orderType === 'dine-in' ? tableNumber.trim() : '',
                        customerName: customerName.trim(),
                        phone: phone.replace(/\D/g, ''),
                        note: note.trim(),
                        status: 'new',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                    playSound('success');
                    lastReadyRef.current = null;
                    setPlacedOrder({ id: docRef.id, orderNumber, status: 'new', items: cartItems, total: cartTotal });
                    setView('confirm');
                    setCart({});
                } catch (e) {
                    showToast('ส่งออเดอร์ไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
                } finally {
                    setSubmitting(false);
                }
            };

            // Live-track the placed order's status so the customer sees progress without refreshing.
            useEffect(() => {
                if (!placedOrder?.id) return;
                const unsub = db.collection('orders').doc(placedOrder.id).onSnapshot((doc) => {
                    if (!doc.exists) return;
                    const data = doc.data();
                    setPlacedOrder(prev => prev && ({ ...prev, status: data.status }));
                    if (data.status === 'ready' && lastReadyRef.current !== 'ready') {
                        playSound('ready');
                    }
                    lastReadyRef.current = data.status;
                });
                return unsub;
            }, [placedOrder?.id]);

            const startNewOrder = () => {
                setPlacedOrder(null);
                setCustomerName('');
                setPhone('');
                setTableNumber('');
                setNote('');
                setView('menu');
            };

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto bg-stone-100 relative">
                    {notification && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl shadow-xl font-medium text-white flex items-center space-x-2 ${
                            notification.type === 'error' ? 'bg-red-500' : 'bg-emerald-600'
                        }`}>
                            <i data-lucide={notification.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-5 h-5"></i>
                            <span className="text-sm">{notification.msg}</span>
                        </div>
                    )}

                    <header className="sticky top-0 z-30 bg-stone-900 text-white px-5 py-4 flex items-center space-x-3 shadow-md">
                        <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center shrink-0">
                            <i data-lucide="coffee" className="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 className="font-bold text-base leading-tight">Little Homie Coffee</h1>
                            <p className="text-[11px] text-stone-400">สั่งเครื่องดื่ม &amp; ของทานเล่น</p>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto pb-28">
                        {view === 'menu' && (
                            <MenuBrowser
                                grouped={grouped}
                                menuLoaded={menuLoaded}
                                cart={cart}
                                changeQty={changeQty}
                            />
                        )}
                        {view === 'checkout' && (
                            <CheckoutView
                                cartItems={cartItems}
                                cartTotal={cartTotal}
                                changeQty={changeQty}
                                orderType={orderType} setOrderType={setOrderType}
                                tableNumber={tableNumber} setTableNumber={setTableNumber}
                                customerName={customerName} setCustomerName={setCustomerName}
                                phone={phone} setPhone={setPhone} formatPhone={formatPhone}
                                note={note} setNote={setNote}
                                onBack={() => setView('menu')}
                                onSubmit={handleSubmitOrder}
                                submitting={submitting}
                            />
                        )}
                        {view === 'confirm' && placedOrder && (
                            <ConfirmationView order={placedOrder} onNewOrder={startNewOrder} />
                        )}
                    </main>

                    {view === 'menu' && cartCount > 0 && (
                        <div className="fixed bottom-0 left-0 right-0 max-w-lg mx-auto p-4 z-30">
                            <button
                                onClick={() => { playSound('tap'); setView('checkout'); }}
                                className="w-full bg-amber-600 hover:bg-amber-700 text-white rounded-2xl py-4 px-5 shadow-2xl shadow-amber-900/30 flex items-center justify-between active:scale-95 transition-all slide-up"
                            >
                                <span className="flex items-center space-x-2 font-bold">
                                    <span className="bg-white/20 rounded-full w-7 h-7 flex items-center justify-center text-sm">{cartCount}</span>
                                    <span>ดูตะกร้า</span>
                                </span>
                                <span className="font-bold">{cartTotal} บาท</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function MenuBrowser({ grouped, menuLoaded, cart, changeQty }) {
            const categories = Object.keys(grouped);

            if (!menuLoaded) {
                return (
                    <div className="flex flex-col items-center justify-center py-24 text-stone-400 space-y-3">
                        <i data-lucide="loader" className="w-8 h-8 animate-spin"></i>
                        <p className="text-sm">กำลังโหลดเมนู...</p>
                    </div>
                );
            }

            if (categories.length === 0) {
                return (
                    <div className="flex flex-col items-center justify-center py-24 text-stone-400 space-y-3 px-6 text-center">
                        <i data-lucide="coffee" className="w-10 h-10"></i>
                        <p className="text-sm">ร้านยังไม่ได้เพิ่มเมนู กรุณากลับมาใหม่อีกครั้ง</p>
                    </div>
                );
            }

            return (
                <div className="px-4 pt-4 space-y-6">
                    {categories.map(cat => (
                        <div key={cat}>
                            <div className="flex items-center space-x-2 mb-2 px-1">
                                <i data-lucide={CATEGORY_ICONS[cat] || 'utensils'} className="w-4 h-4 text-amber-700"></i>
                                <h2 className="font-bold text-stone-700 text-sm">{cat}</h2>
                            </div>
                            <div className="space-y-2">
                                {grouped[cat].map(item => {
                                    const qty = cart[item.id] || 0;
                                    return (
                                        <div key={item.id} className={`bg-white rounded-2xl p-3.5 shadow-sm border flex items-center justify-between ${
                                            item.available === false ? 'opacity-50 border-stone-100' : 'border-stone-100'
                                        }`}>
                                            <div className="min-w-0 pr-3">
                                                <p className="font-semibold text-stone-800 text-sm truncate">{item.name}</p>
                                                <p className="text-xs text-amber-700 font-medium mt-0.5">{item.price} บาท</p>
                                                {item.available === false && <p className="text-[11px] text-red-500 mt-0.5">หมดชั่วคราว</p>}
                                            </div>
                                            {item.available === false ? (
                                                <span className="text-xs text-stone-400 shrink-0">หมด</span>
                                            ) : qty === 0 ? (
                                                <button
                                                    onClick={() => changeQty(item.id, 1)}
                                                    className="shrink-0 w-10 h-10 rounded-xl bg-amber-600 hover:bg-amber-700 text-white flex items-center justify-center active:scale-90 transition-all"
                                                >
                                                    <i data-lucide="plus" className="w-5 h-5"></i>
                                                </button>
                                            ) : (
                                                <div className="shrink-0 flex items-center space-x-2 bg-amber-50 rounded-xl px-1.5 py-1.5">
                                                    <button onClick={() => changeQty(item.id, -1)} className="w-7 h-7 rounded-lg bg-white text-amber-700 flex items-center justify-center shadow-sm active:scale-90 transition-all">
                                                        <i data-lucide="minus" className="w-4 h-4"></i>
                                                    </button>
                                                    <span className="w-5 text-center font-bold text-amber-800 text-sm">{qty}</span>
                                                    <button onClick={() => changeQty(item.id, 1)} className="w-7 h-7 rounded-lg bg-white text-amber-700 flex items-center justify-center shadow-sm active:scale-90 transition-all">
                                                        <i data-lucide="plus" className="w-4 h-4"></i>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function CheckoutView({
            cartItems, cartTotal, changeQty, orderType, setOrderType,
            tableNumber, setTableNumber, customerName, setCustomerName,
            phone, setPhone, formatPhone, note, setNote, onBack, onSubmit, submitting
        }) {
            const canSubmit = cartItems.length > 0 && customerName.trim() && (orderType !== 'dine-in' || tableNumber.trim());

            return (
                <div className="px-4 pt-4 pb-4 space-y-5">
                    <button onClick={onBack} className="flex items-center space-x-1.5 text-stone-500 text-sm font-medium">
                        <i data-lucide="chevron-left" className="w-4 h-4"></i>
                        <span>กลับไปเลือกเมนู</span>
                    </button>

                    <div className="bg-white rounded-3xl p-4 shadow-sm border border-stone-100 space-y-3">
                        <h2 className="font-bold text-stone-800 text-sm">รายการที่สั่ง</h2>
                        {cartItems.map(item => (
                            <div key={item.menuId} className="flex items-center justify-between">
                                <div className="min-w-0 pr-3">
                                    <p className="text-sm font-medium text-stone-700 truncate">{item.name}</p>
                                    <p className="text-xs text-stone-400">{item.price} x {item.qty}</p>
                                </div>
                                <div className="shrink-0 flex items-center space-x-2 bg-stone-50 rounded-xl px-1.5 py-1.5">
                                    <button onClick={() => changeQty(item.menuId, -1)} className="w-7 h-7 rounded-lg bg-white text-stone-600 flex items-center justify-center shadow-sm active:scale-90">
                                        <i data-lucide="minus" className="w-4 h-4"></i>
                                    </button>
                                    <span className="w-5 text-center font-bold text-stone-700 text-sm">{item.qty}</span>
                                    <button onClick={() => changeQty(item.menuId, 1)} className="w-7 h-7 rounded-lg bg-white text-stone-600 flex items-center justify-center shadow-sm active:scale-90">
                                        <i data-lucide="plus" className="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        ))}
                        <div className="pt-3 border-t border-stone-100 flex justify-between items-center">
                            <span className="text-sm font-bold text-stone-700">ยอดรวม</span>
                            <span className="text-lg font-extrabold text-amber-700">{cartTotal} บาท</span>
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl p-4 shadow-sm border border-stone-100 space-y-4">
                        <div>
                            <label className="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-2">รูปแบบการสั่ง</label>
                            <div className="grid grid-cols-2 gap-2">
                                <button
                                    onClick={() => setOrderType('dine-in')}
                                    className={`py-2.5 rounded-xl text-sm font-medium transition-all ${orderType === 'dine-in' ? 'bg-amber-600 text-white shadow-md' : 'bg-stone-100 text-stone-500'}`}
                                >ทานที่ร้าน</button>
                                <button
                                    onClick={() => setOrderType('takeaway')}
                                    className={`py-2.5 rounded-xl text-sm font-medium transition-all ${orderType === 'takeaway' ? 'bg-amber-600 text-white shadow-md' : 'bg-stone-100 text-stone-500'}`}
                                >กลับบ้าน</button>
                            </div>
                        </div>

                        {orderType === 'dine-in' && (
                            <div>
                                <label className="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-1.5">เลขโต๊ะ</label>
                                <input
                                    type="text" value={tableNumber} onChange={e => setTableNumber(e.target.value)}
                                    placeholder="เช่น 5" className="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-sm focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none"
                                />
                            </div>
                        )}

                        <div>
                            <label className="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-1.5">ชื่อผู้สั่ง</label>
                            <input
                                type="text" value={customerName} onChange={e => setCustomerName(e.target.value)}
                                placeholder="ชื่อ หรือ ชื่อเล่น" className="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-sm focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none"
                            />
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-1.5">เบอร์โทร (ถ้ามีบัตรสะสมแต้ม)</label>
                            <input
                                type="tel" value={formatPhone(phone)} onChange={e => setPhone(e.target.value.replace(/\D/g, '').slice(0, 10))}
                                placeholder="08X-XXX-XXXX" className="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-sm focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none"
                            />
                        </div>

                        <div>
                            <label className="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-1.5">หมายเหตุ (ถ้ามี)</label>
                            <textarea
                                value={note} onChange={e => setNote(e.target.value)} rows="2"
                                placeholder="เช่น ไม่ใส่น้ำแข็ง, หวานน้อย" className="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-sm focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none resize-none"
                            />
                        </div>
                    </div>

                    <button
                        onClick={onSubmit}
                        disabled={!canSubmit || submitting}
                        className={`w-full py-4 rounded-2xl font-bold text-base shadow-lg transition-all flex items-center justify-center space-x-2 ${
                            canSubmit && !submitting ? 'bg-amber-600 hover:bg-amber-700 text-white active:scale-95' : 'bg-stone-200 text-stone-400'
                        }`}
                    >
                        {submitting ? (
                            <i data-lucide="loader" className="w-5 h-5 animate-spin"></i>
                        ) : (
                            <React.Fragment>
                                <i data-lucide="send" className="w-5 h-5"></i>
                                <span>ยืนยันสั่งซื้อ ({cartTotal} บาท)</span>
                            </React.Fragment>
                        )}
                    </button>
                </div>
            );
        }

        function ConfirmationView({ order, onNewOrder }) {
            const stepIndex = STATUS_STEPS.findIndex(s => s.key === order.status);
            const isCancelled = order.status === 'cancelled';
            const isDone = order.status === 'done';

            return (
                <div className="px-4 pt-6 pb-4 space-y-5">
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-stone-100 text-center pop-in">
                        <p className="text-xs text-stone-400 uppercase tracking-wider font-bold">ออเดอร์ของคุณ</p>
                        <p className="text-4xl font-extrabold text-amber-700 mt-1">#{order.orderNumber}</p>
                        <p className="text-sm text-stone-500 mt-2">
                            {isCancelled ? 'ออเดอร์นี้ถูกยกเลิก' : isDone ? 'รับเรียบร้อยแล้ว ขอบคุณค่ะ/ครับ' : 'กรุณารอสักครู่นะคะ/ครับ'}
                        </p>
                    </div>

                    {!isCancelled && (
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-stone-100">
                            <div className="flex items-center justify-between">
                                {STATUS_STEPS.map((step, idx) => {
                                    const active = idx <= (isDone ? STATUS_STEPS.length : stepIndex);
                                    return (
                                        <React.Fragment key={step.key}>
                                            <div className="flex flex-col items-center space-y-1.5 flex-1">
                                                <div className={`w-10 h-10 rounded-2xl flex items-center justify-center transition-all ${
                                                    active ? 'bg-amber-600 text-white' : 'bg-stone-100 text-stone-400'
                                                }`}>
                                                    <i data-lucide={active && idx < stepIndex ? 'check' : step.icon} className={`w-5 h-5 ${step.icon === 'loader' && idx === stepIndex ? 'animate-spin' : ''}`}></i>
                                                </div>
                                                <span className={`text-[11px] text-center font-medium ${active ? 'text-amber-700' : 'text-stone-400'}`}>{step.label}</span>
                                            </div>
                                            {idx < STATUS_STEPS.length - 1 && (
                                                <div className={`h-0.5 flex-1 -mt-5 ${idx < stepIndex ? 'bg-amber-600' : 'bg-stone-100'}`}></div>
                                            )}
                                        </React.Fragment>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-stone-100 space-y-2">
                        {order.items.map(item => (
                            <div key={item.menuId} className="flex justify-between text-sm">
                                <span className="text-stone-600">{item.name} x{item.qty}</span>
                                <span className="text-stone-700 font-medium">{item.price * item.qty} บาท</span>
                            </div>
                        ))}
                        <div className="pt-2 border-t border-stone-100 flex justify-between">
                            <span className="text-sm font-bold text-stone-700">รวม</span>
                            <span className="font-bold text-amber-700">{order.total} บาท</span>
                        </div>
                    </div>

                    <button
                        onClick={onNewOrder}
                        className="w-full py-3.5 bg-stone-800 hover:bg-stone-900 text-white rounded-2xl font-medium transition-all active:scale-95"
                    >
                        สั่งเพิ่ม / สั่งใหม่
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
