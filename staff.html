        // Staff-side order entry for walk-in customers: tap menu items, optionally attach a
        // member's phone, and the sale lands on the order board and the daily report like any
        // order placed from the customer page.
        function CounterSaleView({ menuItems, customers, formatPhone, showToast }) {
            const [cart, setCart] = useState({});
            const [orderType, setOrderType] = useState('takeaway');
            const [tableNumber, setTableNumber] = useState('');
            const [customerName, setCustomerName] = useState('');
            const [phone, setPhone] = useState('');
            const [note, setNote] = useState('');
            const [submitting, setSubmitting] = useState(false);
            // Free drinks ride along in the same order as a separate, unpriced cart, so a
            // customer collecting their reward alongside a paid round is one ticket.
            const [freeCart, setFreeCart] = useState({});
            const [freePicking, setFreePicking] = useState(false);

            const grouped = useMemo(() => {
                const byCat = {};
                menuItems.filter(m => m.available !== false).forEach(item => {
                    if (!byCat[item.category]) byCat[item.category] = [];
                    byCat[item.category].push(item);
                });
                return byCat;
            }, [menuItems]);

            const cartItems = useMemo(() => Object.entries(cart)
                .filter(([, qty]) => qty > 0)
                .map(([key, qty]) => {
                    const [menuId, serveType] = key.split('|');
                    const item = menuItems.find(m => m.id === menuId);
                    return item ? {
                        key, menuId, name: item.name, price: priceFor(item, serveType), qty, serveType,
                        addon: item.addon === true,
                    } : null;
                })
                .filter(Boolean), [cart, menuItems]);

            const cups = cupCount(cartItems);
            const total = cartItems.reduce((sum, i) => sum + i.price * i.qty, 0);

            const freeItems = useMemo(() => Object.entries(freeCart)
                .filter(([, qty]) => qty > 0)
                .map(([key, qty]) => {
                    const [menuId, serveType] = key.split('|');
                    const item = menuItems.find(m => m.id === menuId);
                    return item ? { key, menuId, name: item.name, price: 0, qty, serveType, free: true } : null;
                })
                .filter(Boolean), [freeCart, menuItems]);
            const freeCups = freeItems.reduce((sum, i) => sum + i.qty, 0);
            const nothingToOrder = cartItems.length === 0 && freeItems.length === 0;

            const cleanPhone = phone.replace(/\D/g, '');

            // Looked up by document id once the number is long enough to be one, so a member
            // is found whether or not they are among the recently-active ones held in memory.
            const [member, setMember] = useState(null);
            useEffect(() => {
                if (cleanPhone.length < 9) {
                    setMember(null);
                    return;
                }
                let cancelled = false;
                lookupCustomer(cleanPhone).then(found => { if (!cancelled) setMember(found); });
                return () => { cancelled = true; };
            }, [cleanPhone]);

            // Free cups belong to the member on the ticket, so changing who that is clears them.
            // The points this order is about to earn count towards the card right away, so a
            // customer who reaches ten mid-order can take the free drink on the same ticket.
            const bankedFree = member ? (member.freeDrinks || 0) : 0;
            const freeCredit = member ? bankedFree + Math.floor(((member.points || 0) + cups) / MAX_STAMPS_PER_CARD) : 0;
            const freeLeft = Math.max(0, freeCredit - freeCups);
            // Taking a paid drink back out can undo the card that was just filled, so the
            // ticket says so rather than failing at the till.
            const freeOverLimit = Math.max(0, freeCups - freeCredit);
            const freeFromThisOrder = Math.max(0, freeCredit - freeDrinkCredit(member));
            const freePointsSpent = Math.max(0, freeCups - bankedFree) * MAX_STAMPS_PER_CARD;
            const pointsAfter = member ? Math.max(0, (member.points || 0) + cups - freePointsSpent) : 0;
            useEffect(() => {
                if (!member) {
                    setFreeCart({});
                    setFreePicking(false);
                }
            }, [member]);

            // The member box takes a name or a number. A number is also the phone the sale is
            // recorded against, so a new customer can still be signed up by typing theirs in
            // full; a name only identifies someone once they're picked from the matches.
            const [memberQuery, setMemberQuery] = useState('');
            const queryIsPhone = memberQuery.length > 0 && /^\d+$/.test(memberQuery);
            const suggestions = useMemberSearch(memberQuery, customers);

            const changeMemberQuery = (value) => {
                const isPhone = /^[\d\s-]*$/.test(value);
                const next = isPhone ? value.replace(/\D/g, '').slice(0, 10) : value;
                setMemberQuery(next);
                setPhone(isPhone ? next : '');
                // Only a brand-new number needs a name typed in, and that box goes away with it.
                setCustomerName('');
                setFreeCart({});
                setFreePicking(false);
            };

            const pickMember = (picked) => {
                playSound('tap');
                setFreeCart({});
                setFreePicking(false);
                // Shown straight away; the lookup that follows only refreshes it.
                setMember(picked);
                setMemberQuery(picked.phone);
                setPhone(picked.phone);
                setCustomerName('');
            };

            const changeQty = (key, delta) => {
                playSound('tap');
                setCart(prev => ({ ...prev, [key]: Math.max(0, (prev[key] || 0) + delta) }));
            };

            // Only stamps already on the card can be banked — points this order is about to
            // earn aren't the customer's until the order is saved.
            const [banking, setBanking] = useState(false);
            const canBank = !!member && (member.points || 0) >= MAX_STAMPS_PER_CARD;
            const handleBankFreeDrink = async () => {
                if (!canBank || banking) return;
                const phone = member.phone || member.id;
                setBanking(true);
                try {
                    await bankFreeDrink(phone, member.name);
                    playSound('redeem');
                    const refreshed = await lookupCustomer(phone);
                    if (refreshed) setMember(refreshed);
                    showToast('เก็บแก้วฟรีไว้ให้ลูกค้าแล้ว');
                } catch (e) {
                    showToast('เก็บแก้วฟรีไม่สำเร็จ', 'error');
                } finally {
                    setBanking(false);
                }
            };

            const changeFreeQty = (key, delta) => {
                if (delta > 0 && freeLeft <= 0) return;
                playSound('tap');
                setFreeCart(prev => ({ ...prev, [key]: Math.max(0, (prev[key] || 0) + delta) }));
            };

            // While a free drink is being chosen, a tap on the menu puts that drink on the
            // ticket at no charge instead of selling it.
            const pickMenu = (key) => {
                if (!freePicking) {
                    changeQty(key, 1);
                    return;
                }
                if (freeLeft <= 0) return;
                playSound('redeem');
                setFreeCart(prev => ({ ...prev, [key]: (prev[key] || 0) + 1 }));
                setFreePicking(false);
            };

            const handleSubmit = async () => {
                if (nothingToOrder || submitting) return;
                if (orderType === 'dine-in' && !tableNumber.trim()) {
                    showToast('กรุณาระบุเลขโต๊ะ', 'error');
                    return;
                }
                if (cleanPhone && cleanPhone.length < 9) {
                    showToast('เบอร์สมาชิกไม่ถูกต้อง', 'error');
                    return;
                }
                if (freeCups > 0 && !cleanPhone) {
                    showToast('แก้วฟรีต้องระบุสมาชิกก่อน', 'error');
                    return;
                }
                if (freeOverLimit > 0) {
                    showToast(`แก้วฟรีเกินสิทธิ์ ${freeOverLimit} แก้ว`, 'error');
                    return;
                }
                setSubmitting(true);
                try {
                    const orderNumber = await getNextOrderNumber();
                    const memberName = (member ? member.name : '') || (queryIsPhone ? customerName.trim() : memberQuery.trim());
                    const dayKey = dateKey(new Date());
                    // Free cups sit on the same ticket at zero baht, flagged so the report
                    // counts them as given away rather than sold.
                    const lines = [
                        ...cartItems.map(({ menuId, name, price, qty, serveType, addon }) => ({
                            menuId, name, price, qty,
                            ...(serveType ? { serveType } : {}),
                            ...(addon ? { addon: true } : {}),
                        })),
                        ...freeItems.map(({ menuId, name, qty, serveType }) => ({
                            menuId, name, price: 0, qty, free: true,
                            ...(serveType ? { serveType } : {}),
                        })),
                    ];
                    await db.collection('orders').add({
                        orderNumber,
                        items: lines,
                        total,
                        orderType,
                        tableNumber: orderType === 'dine-in' ? tableNumber.trim() : '',
                        customerName: memberName || 'ลูกค้าหน้าร้าน',
                        phone: cleanPhone,
                        note: note.trim(),
                        status: 'new',
                        itemCount: cups,
                        pointsAwarded: cleanPhone ? cups : 0,
                        ...(freeCups ? { freeCount: freeCups } : {}),
                        dayKey,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                    // These run after the order is safely saved, so none of them may report
                    // the sale as failed — that would invite staff to key the whole thing in
                    // a second time.
                    recordSale(dayKey, { items: lines, total }, 1)
                        .catch(() => showToast('ออเดอร์บันทึกแล้ว แต่ยอดขายในรายงานไม่อัปเดต', 'error'));
                    let message = `บันทึกออเดอร์ #${orderNumber} สำเร็จ`;
                    if (cleanPhone) {
                        try {
                            await earnPointsForOrder(cleanPhone, memberName, cups, orderNumber);
                            playSound('stamp');
                            if (cups > 0) message = `บันทึกออเดอร์ #${orderNumber} · สะสม +${cups} แต้ม`;
                        } catch (e) {
                            showToast(`บันทึกออเดอร์ #${orderNumber} แล้ว แต่สะสมแต้มไม่สำเร็จ`, 'error');
                            message = '';
                        }
                    }
                    if (freeCups > 0) {
                        try {
                            await spendFreeDrinks(cleanPhone, memberName, freeCups, freeItems.map(i => itemLabel(i)).join(', '));
                            if (message) message += ` · แก้วฟรี ${freeCups} แก้ว`;
                        } catch (e) {
                            showToast(`บันทึกออเดอร์ #${orderNumber} แล้ว แต่ตัดสิทธิ์แก้วฟรีไม่สำเร็จ`, 'error');
                            message = '';
                        }
                    }
                    if (message) showToast(message);
                    setCart({});
                    setFreeCart({});
                    setFreePicking(false);
                    setTableNumber('');
                    setCustomerName('');
                    changeMemberQuery('');
                    setNote('');
                } catch (e) {
                    showToast('บันทึกออเดอร์ไม่สำเร็จ', 'error');
                } finally {
                    setSubmitting(false);
                }
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-7xl mx-auto">

                    <div className="lg:col-span-7 space-y-5">
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                            <h2 className="text-2xl font-bold text-stone-800">ขายหน้าร้าน</h2>
                            <p className="text-xs text-stone-400 mt-0.5">กดเลือกเมนูเพื่อเปิดออเดอร์ให้ลูกค้าที่หน้าร้าน</p>
                        </div>

                        {freePicking && (
                            <div className="bg-sky-100 border border-sky-300 rounded-2xl px-4 py-3 flex items-center justify-between gap-3">
                                <div className="flex items-center space-x-2 min-w-0">
                                    <Icon name="gift" className="w-5 h-5 text-sky-800 shrink-0"></Icon>
                                    <p className="text-sm font-bold text-sky-900 truncate">แตะเมนูที่จะให้ฟรี 1 แก้ว</p>
                                </div>
                                <button
                                    onClick={() => setFreePicking(false)}
                                    className="shrink-0 px-3 py-1.5 rounded-xl bg-white text-sky-900 text-xs font-bold border border-sky-300"
                                >
                                    ยกเลิก
                                </button>
                            </div>
                        )}

                        {Object.keys(grouped).length === 0 ? (
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                                <p className="text-sm text-stone-400 text-center py-6">ยังไม่มีเมนูที่พร้อมขาย</p>
                            </div>
                        ) : (
                            Object.keys(grouped).map(cat => (
                                <div key={cat} className="space-y-2">
                                    <div className="flex items-center space-x-2 px-1">
                                        <Icon name={CATEGORY_ICONS[cat] || 'utensils'} className="w-4 h-4 text-amber-700"></Icon>
                                        <h3 className="font-bold text-stone-700 text-sm">{cat}</h3>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                        {grouped[cat].map(item => {
                                            const options = serveOptions(item);
                                            const choose = options.length > 1;
                                            const singleKey = cartKey(item.id, options[0]);
                                            const qty = choose
                                                ? options.reduce((sum, t) => sum + (cart[cartKey(item.id, t)] || 0), 0)
                                                : (cart[singleKey] || 0);
                                            return (
                                                <div
                                                    key={item.id}
                                                    onClick={choose ? undefined : () => pickMenu(singleKey)}
                                                    className={`relative p-3 rounded-2xl border text-left transition-all ${choose ? '' : 'cursor-pointer active:scale-95'} ${
                                                        qty > 0
                                                            ? 'bg-amber-50 border-amber-300 shadow-sm'
                                                            : 'bg-white border-stone-100 hover:border-amber-200'
                                                    }`}
                                                >
                                                    <p className="font-semibold text-stone-800 text-sm leading-tight">{item.name}</p>
                                                    <p className="text-xs text-amber-700 font-medium mt-1">{priceFor(item, options[0])} บาท</p>
                                                    {options.length === 1 && (
                                                        <p className="text-[11px] text-stone-400 mt-1">มีแต่แบบ{serveLabel(options[0])}</p>
                                                    )}
                                                    {choose ? (
                                                        <div className="grid grid-cols-2 gap-1 mt-2">
                                                            {options.map(t => {
                                                                const optQty = cart[cartKey(item.id, t)] || 0;
                                                                return (
                                                                    <button
                                                                        key={t}
                                                                        onClick={() => pickMenu(cartKey(item.id, t))}
                                                                        className={`py-1.5 rounded-lg text-[11px] font-semibold leading-tight transition-all active:scale-95 ${
                                                                            optQty > 0 ? 'bg-amber-300 text-amber-950' : 'bg-stone-100 text-stone-600 hover:bg-amber-100'
                                                                        }`}
                                                                    >
                                                                        {serveLabel(t)} {priceFor(item, t)}.-{optQty > 0 ? ` · ${optQty}` : ''}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    ) : qty > 0 && (
                                                        <span className="absolute top-2 right-2 w-6 h-6 rounded-full bg-amber-300 text-amber-950 text-xs font-bold flex items-center justify-center">
                                                            {qty}
                                                        </span>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    <div className="lg:col-span-5">
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-stone-100 space-y-4 lg:sticky lg:top-0">
                            <h3 className="font-bold text-sm uppercase tracking-wider text-stone-500">รายการที่สั่ง</h3>

                            {nothingToOrder ? (
                                <p className="text-sm text-stone-400 text-center py-6">ยังไม่ได้เลือกเมนู</p>
                            ) : (
                                <div className="space-y-2 max-h-64 overflow-y-auto">
                                    {cartItems.map(item => (
                                        <div key={item.key} className="flex items-center justify-between gap-2">
                                            <div className="min-w-0 pr-1">
                                                <p className="text-sm font-medium text-stone-700 truncate">{itemLabel(item)}</p>
                                                <p className="text-xs text-stone-400">{item.price} x {item.qty}</p>
                                            </div>
                                            <div className="shrink-0 flex items-center space-x-2 bg-stone-50 rounded-xl px-1.5 py-1.5">
                                                <button onClick={() => changeQty(item.key, -1)} className="w-7 h-7 rounded-lg bg-white text-stone-600 flex items-center justify-center shadow-sm active:scale-90">
                                                    <Icon name="minus" className="w-4 h-4"></Icon>
                                                </button>
                                                <span className="w-5 text-center font-bold text-stone-700 text-sm">{item.qty}</span>
                                                <button onClick={() => changeQty(item.key, 1)} className="w-7 h-7 rounded-lg bg-white text-stone-600 flex items-center justify-center shadow-sm active:scale-90">
                                                    <Icon name="plus" className="w-4 h-4"></Icon>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                    {freeItems.map(item => (
                                        <div key={`free-${item.key}`} className="flex items-center justify-between gap-2">
                                            <div className="min-w-0 pr-1">
                                                <p className="text-sm font-medium text-stone-700 truncate">
                                                    {itemLabel(item)}
                                                    <span className="ml-1.5 text-[10px] font-bold bg-sky-200 text-sky-900 rounded px-1.5 py-0.5 align-middle">ฟรี</span>
                                                </p>
                                                <p className="text-xs text-sky-700">แก้วฟรีจากแต้มสะสม · 0 บาท</p>
                                            </div>
                                            <div className="shrink-0 flex items-center space-x-2 bg-sky-50 rounded-xl px-1.5 py-1.5">
                                                <button onClick={() => changeFreeQty(item.key, -1)} className="w-7 h-7 rounded-lg bg-white text-stone-600 flex items-center justify-center shadow-sm active:scale-90">
                                                    <Icon name="minus" className="w-4 h-4"></Icon>
                                                </button>
                                                <span className="w-5 text-center font-bold text-sky-900 text-sm">{item.qty}</span>
                                                <button
                                                    onClick={() => changeFreeQty(item.key, 1)}
                                                    disabled={freeLeft <= 0}
                                                    className={`w-7 h-7 rounded-lg flex items-center justify-center shadow-sm active:scale-90 ${
                                                        freeLeft > 0 ? 'bg-white text-stone-600' : 'bg-stone-100 text-stone-300 cursor-not-allowed'
                                                    }`}
                                                >
                                                    <Icon name="plus" className="w-4 h-4"></Icon>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="pt-3 border-t border-stone-100 space-y-1">
                                <div className="flex justify-between items-center">
                                    <span className="text-sm font-bold text-stone-700">ยอดรวม</span>
                                    <span className="text-xl font-extrabold text-amber-700">{total.toLocaleString()} บาท</span>
                                </div>
                                {freeCups > 0 && (
                                    <div className="flex justify-between items-center text-[11px] font-semibold text-sky-800">
                                        <span>แก้วฟรีในออเดอร์นี้</span>
                                        <span>{freeCups} แก้ว · ไม่คิดเงิน</span>
                                    </div>
                                )}
                                {freeOverLimit > 0 && (
                                    <p className="text-[11px] font-semibold text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2">
                                        แก้วฟรีเกินสิทธิ์ {freeOverLimit} แก้ว · ลบออกก่อนบันทึก
                                    </p>
                                )}
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <button
                                    onClick={() => setOrderType('takeaway')}
                                    className={`py-2.5 rounded-xl text-sm font-medium transition-all ${orderType === 'takeaway' ? 'bg-amber-300 text-amber-950 shadow-sm' : 'bg-stone-100 text-stone-500'}`}
                                >
                                    กลับบ้าน
                                </button>
                                <button
                                    onClick={() => setOrderType('dine-in')}
                                    className={`py-2.5 rounded-xl text-sm font-medium transition-all ${orderType === 'dine-in' ? 'bg-amber-300 text-amber-950 shadow-sm' : 'bg-stone-100 text-stone-500'}`}
                                >
                                    ทานที่ร้าน
                                </button>
                            </div>

                            {orderType === 'dine-in' && (
                                <input
                                    type="text" value={tableNumber} onChange={e => setTableNumber(e.target.value)} placeholder="เลขโต๊ะ"
                                    className="w-full bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                                />
                            )}

                            <div>
                                <label className="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1.5">ลูกค้า · ชื่อหรือเบอร์ (ถ้ามี)</label>
                                <div className="relative">
                                    <input
                                        type="text"
                                        value={queryIsPhone ? formatPhone(memberQuery) : memberQuery}
                                        onChange={e => changeMemberQuery(e.target.value)}
                                        placeholder="พิมพ์ชื่อหรือเบอร์โทร"
                                        className="w-full bg-stone-100 border-none rounded-2xl pl-4 pr-11 py-3 text-base font-semibold text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                                    />
                                    {memberQuery && (
                                        <button
                                            type="button"
                                            onClick={() => changeMemberQuery('')}
                                            className="absolute right-2.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-stone-200 text-stone-600 flex items-center justify-center hover:bg-stone-300"
                                        >
                                            <Icon name="x" className="w-4 h-4"></Icon>
                                        </button>
                                    )}
                                </div>
                                {!member && (
                                    <div className="mt-2">
                                        <MemberSuggestions members={suggestions} onPick={pickMember} formatPhone={formatPhone} />
                                    </div>
                                )}
                                {member ? (
                                    <div className="mt-2 bg-sky-50 border border-sky-200 rounded-2xl p-3 space-y-2">
                                        <div className="flex items-center justify-between gap-2">
                                            <div className="flex items-center space-x-2 min-w-0">
                                                <div className="w-9 h-9 rounded-xl bg-sky-300 text-sky-950 font-bold text-sm flex items-center justify-center shrink-0">
                                                    {memberLabel(member).slice(0, 2)}
                                                </div>
                                                <div className="min-w-0">
                                                    <p className="font-bold text-stone-800 text-sm truncate">{memberLabel(member)}</p>
                                                    <p className="text-[11px] text-stone-500">{formatPhone(member.phone)}</p>
                                                </div>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <p className="text-xl font-extrabold text-amber-700 leading-none">{member.points || 0}</p>
                                                <p className="text-[10px] text-stone-500 mt-0.5">แต้มสะสม</p>
                                            </div>
                                        </div>
                                        <div className="flex flex-wrap gap-x-3 justify-between items-center text-[11px] text-stone-500 pt-2 border-t border-sky-200">
                                            <span>สั่งไปแล้ว {member.totalDrinks || 0} แก้ว ({member.orderCount || 0} ครั้ง)</span>
                                            <span>ล่าสุด {member.lastVisit ? member.lastVisit.split(' ')[0] : '-'}</span>
                                        </div>
                                        {freeCredit > 0 ? (
                                            <div className="bg-white border-2 border-sky-400 rounded-2xl p-3 space-y-2">
                                                <div className="flex items-start space-x-2">
                                                    <Icon name="party-popper" className="w-5 h-5 text-sky-700 shrink-0"></Icon>
                                                    <div className="min-w-0">
                                                        <p className="font-bold text-stone-800 text-sm">
                                                            ลูกค้ารับแก้วฟรีได้ {freeLeft} แก้ว
                                                        </p>
                                                        <p className="text-[11px] text-stone-500">
                                                            รับไปแล้ว {member.freeDrinksRedeemed || 0} แก้ว{freeCups > 0 ? ` · ใส่ในออเดอร์นี้แล้ว ${freeCups} แก้ว` : ''}
                                                        </p>
                                                        {freeFromThisOrder > 0 && (
                                                            <p className="text-[11px] font-semibold text-emerald-700 mt-0.5">
                                                                รวมแต้มจากออเดอร์นี้แล้ว (บัตรเต็มระหว่างสั่ง)
                                                            </p>
                                                        )}
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => { playSound('tap'); setFreePicking(p => !p); }}
                                                    disabled={freeLeft <= 0}
                                                    className={`w-full py-2.5 rounded-xl text-sm font-bold transition-all active:scale-95 ${
                                                        freeLeft <= 0
                                                            ? 'bg-stone-100 text-stone-400 cursor-not-allowed'
                                                            : freePicking
                                                                ? 'bg-white border-2 border-sky-400 text-sky-900'
                                                                : 'bg-sky-300 hover:bg-sky-400 text-sky-950'
                                                    }`}
                                                >
                                                    {freeLeft <= 0 ? 'ใช้ครบแล้ว' : freePicking ? 'กำลังเลือก... (กดเพื่อยกเลิก)' : 'ใช้แก้วฟรีในออเดอร์นี้'}
                                                </button>
                                                {canBank && (
                                                    <button
                                                        onClick={handleBankFreeDrink}
                                                        disabled={banking}
                                                        className="w-full py-2 rounded-xl text-xs font-bold bg-white border border-stone-200 text-stone-700 hover:bg-stone-50 active:scale-95 transition-all"
                                                    >
                                                        {banking ? 'กำลังบันทึก...' : 'ยังไม่รับ · เก็บไว้ก่อน'}
                                                    </button>
                                                )}
                                                <p className="text-[10px] text-stone-400 text-center">
                                                    รับกี่แก้วก็ได้ ที่เหลือระบบเก็บไว้ให้ · ไม่รับเลยก็ได้ แต้มไม่หาย
                                                </p>
                                            </div>
                                        ) : (member.freeDrinksRedeemed > 0 && (
                                            <p className="text-[11px] font-semibold text-sky-800 bg-sky-100 rounded-lg px-2 py-1">
                                                แก้วฟรี: รับไปแล้ว {member.freeDrinksRedeemed || 0} แก้ว
                                            </p>
                                        ))}
                                        {(cups > 0 || freeCups > 0) && (
                                            <p className="text-[11px] font-semibold text-emerald-700">
                                                ออเดอร์นี้ +{cups} แต้ม{freePointsSpent > 0 ? ` · ใช้แก้วฟรี -${freePointsSpent} แต้ม` : ''} → เหลือ {pointsAfter} แต้ม
                                            </p>
                                        )}
                                    </div>
                                ) : cleanPhone.length >= 9 ? (
                                    <div className="mt-2 bg-amber-50 border border-amber-200 rounded-2xl px-3 py-2 space-y-2">
                                        <p className="text-xs text-amber-800">
                                            เบอร์ใหม่ · จะสมัครสมาชิกให้อัตโนมัติ{cups > 0 ? ` และรับ +${cups} แต้ม` : ''}
                                        </p>
                                        <input
                                            type="text" value={customerName} onChange={e => setCustomerName(e.target.value)}
                                            placeholder="ชื่อลูกค้า (ถ้ามี)"
                                            className="w-full bg-white border border-amber-200 rounded-xl px-3 py-2 text-sm text-stone-800 focus:ring-2 focus:ring-amber-400 outline-none"
                                        />
                                    </div>
                                ) : null}
                            </div>

                            <input

        function MenuManageView({ menuItems, showToast }) {
            const [name, setName] = useState('');
            const [category, setCategory] = useState('');
            const [price, setPrice] = useState('');
            const [newServeTypes, setNewServeTypes] = useState([]);
            const [newAddon, setNewAddon] = useState(false);

            const categories = useMemo(() => {
                const set = new Set(menuItems.map(m => m.category));
                return Array.from(set);
            }, [menuItems]);

            const grouped = useMemo(() => {
                const byCat = {};
                menuItems.forEach(item => {
                    if (!byCat[item.category]) byCat[item.category] = [];
                    byCat[item.category].push(item);
                });
                return byCat;
            }, [menuItems]);

            const handleAdd = (e) => {
                e.preventDefault();
                if (!name || !category || !price) return;
                const maxSort = menuItems.reduce((m, i) => Math.max(m, i.sortOrder || 0), 0);
                db.collection('menu').add({
                    name, category, price: parseFloat(price), available: true, sortOrder: maxSort + 1,
                    serveTypes: newServeTypes,
                    addon: newAddon,
                }).then(() => {
                    setName(''); setCategory(''); setPrice(''); setNewServeTypes([]); setNewAddon(false);
                    showToast('เพิ่มเมนูสำเร็จ');
                }).catch(() => showToast('เพิ่มเมนูไม่สำเร็จ', 'error'));
            };

            // Kept in the order SERVE_TYPES declares, so เย็น always reads before ปั่น.
            const toggleServeType = (item, key) => {
                const current = item.serveTypes || [];
                const turningOn = !current.includes(key);
                const next = SERVE_TYPES.map(t => t.key)
                    .filter(k => (k === key ? turningOn : current.includes(k)));
                const update = { serveTypes: next };
                // Once an item has options they carry its price on their own, so seed the new
                // one from what it costs today — the single price field is hidden from then on.
                if (turningOn) update[`servePrices.${key}`] = priceFor(item, key);
                db.collection('menu').doc(item.id).update(update)
                    .catch(() => showToast('บันทึกตัวเลือกไม่สำเร็จ', 'error'));
            };

            const updateServePrice = (item, key, value) => {
                const price = parseFloat(value);
                if (!(price >= 0) || price === priceFor(item, key)) return;
                db.collection('menu').doc(item.id)
                    .update({ [`servePrices.${key}`]: price })
                    .catch(() => showToast('บันทึกราคาไม่สำเร็จ', 'error'));
            };

            const toggleAvailable = (item) => {
                db.collection('menu').doc(item.id).update({ available: !item.available }).catch(() => {});
            };

            const updateField = (item, field, value) => {
                db.collection('menu').doc(item.id).update({ [field]: value }).catch(() => {});
            };

            const handleDelete = (item) => {
                db.collection('menu').doc(item.id).delete().then(() => {
                    showToast('ลบเมนูเรียบร้อยแล้ว');
                }).catch(() => showToast('ลบเมนูไม่สำเร็จ', 'error'));
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <h2 className="text-2xl font-bold text-stone-800">จัดการเมนู</h2>
                        <p className="text-xs text-stone-400 mt-0.5">เมนูที่นี่จะแสดงบนหน้าสั่งซื้อของลูกค้าแบบเรียลไทม์</p>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <h3 className="font-bold text-stone-800 mb-4 text-sm uppercase tracking-wider text-stone-500">+ เพิ่มเมนูใหม่</h3>
                        <form onSubmit={handleAdd} className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                            <input
                                type="text" placeholder="ชื่อเมนู" value={name} onChange={e => setName(e.target.value)} required
                                className="sm:col-span-4 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <input
                                type="text" placeholder="หมวดหมู่ เช่น กาแฟ" value={category} onChange={e => setCategory(e.target.value)} required list="category-options"
                                className="sm:col-span-4 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <datalist id="category-options">
                                {categories.map(c => <option key={c} value={c} />)}
                            </datalist>
                            <input
                                type="number" placeholder="ราคา" value={price} onChange={e => setPrice(e.target.value)} required min="0"
                                className="sm:col-span-2 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <button type="submit" className="sm:col-span-2 bg-amber-300 hover:bg-amber-400 text-amber-950 font-bold py-3 rounded-2xl text-sm transition-all shadow-sm active:scale-95">
                                เพิ่ม
                            </button>
                            <div className="sm:col-span-12 flex items-center flex-wrap gap-2">
                                <span className="text-xs text-stone-500">สั่งได้แบบ:</span>
                                {SERVE_TYPES.map(t => {
                                    const on = newServeTypes.includes(t.key);
                                    return (
                                        <button
                                            key={t.key}
                                            type="button"
                                            onClick={() => setNewServeTypes(SERVE_TYPES.map(s => s.key)
                                                .filter(k => (k === t.key ? !on : newServeTypes.includes(k))))}
                                            className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                                                on ? 'bg-amber-300 text-amber-950' : 'bg-stone-100 text-stone-500 hover:bg-amber-100'
                                            }`}
                                        >
                                            {t.label}
                                        </button>
                                    );
                                })}
                                <span className="text-[11px] text-stone-400">ไม่เลือก = ไม่ต้องถามตอนสั่ง (เช่น เบเกอรี่)</span>
                                <button
                                    type="button"
                                    onClick={() => setNewAddon(!newAddon)}
                                    className={`ml-auto px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                                        newAddon ? 'bg-sky-300 text-sky-950' : 'bg-stone-100 text-stone-500 hover:bg-sky-100'
                                    }`}
                                >
                                    {newAddon ? 'ของเพิ่ม · ไม่นับแก้ว' : 'นับเป็นแก้ว'}
                                </button>
                            </div>
                        </form>
                    </div>

                    {Object.keys(grouped).map(cat => (
                        <div key={cat} className="space-y-3">
                            <div className="flex items-center space-x-2 px-1">
                                <Icon name={CATEGORY_ICONS[cat] || 'utensils'} className="w-4 h-4 text-amber-700"></Icon>
                                <h3 className="font-bold text-stone-700 text-sm">{cat}</h3>
                            </div>
                            {grouped[cat].map(item => (
                                <div key={item.id} className={`bg-white p-4 rounded-2xl shadow-sm border space-y-2 ${item.available === false ? 'opacity-60 border-stone-100' : 'border-stone-100'}`}>
                                    <div className="flex items-center justify-between gap-3">
                                        <input
                                            type="text" defaultValue={item.name}
                                            onBlur={(e) => e.target.value !== item.name && updateField(item, 'name', e.target.value)}
                                            className="flex-1 min-w-0 bg-transparent font-semibold text-stone-800 text-sm outline-none focus:bg-stone-50 rounded-lg px-1"
                                        />
                                        {(item.serveTypes || []).length === 0 && (
                                            <input
                                                type="number" defaultValue={item.price}
                                                onBlur={(e) => Number(e.target.value) !== item.price && updateField(item, 'price', parseFloat(e.target.value) || 0)}
                                                className="w-20 bg-transparent text-amber-700 font-semibold text-sm text-right outline-none focus:bg-stone-50 rounded-lg px-1"
                                            />
                                        )}
                                        <button
                                            onClick={() => toggleAvailable(item)}
                                            className={`px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 ${item.available === false ? 'bg-stone-100 text-stone-500' : 'bg-emerald-100 text-emerald-700'}`}
                                        >
                                            {item.available === false ? 'หมด' : 'มีขาย'}
                                        </button>
                                        <button onClick={() => handleDelete(item)} className="p-2 text-stone-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all shrink-0">
                                            <Icon name="trash-2" className="w-4 h-4"></Icon>
                                        </button>
                                    </div>
                                    <div className="flex items-center flex-wrap gap-2 pt-2 border-t border-stone-50">
                                        <span className="text-[11px] text-stone-400">สั่งได้แบบ:</span>
                                        {SERVE_TYPES.map(t => {
                                            const on = (item.serveTypes || []).includes(t.key);

                                                    <button

                                                        {t.label}
                                                    </button>
                                                    {on && (
                                                        <input
                                                            type="number" min="0" defaultValue={priceFor(item, t.key)}
                                                            onBlur={(e) => updateServePrice(item, t.key, e.target.value)}

                                                item.addon ? 'bg-sky-300 text-sky-950' : 'bg-stone-100 text-stone-500 hover:bg-sky-100'

                                        >
                                            {item.addon ? 'ของเพิ่ม · ไม่นับแก้ว' : 'นับเป็นแก้ว'}
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
            );

        function ReportsView({ dailySales, menuItems }) {
            const addonIds = useMemo(() => new Set(menuItems.filter(m => m.addon).map(m => m.id)), [menuItems]);

            const salesByDay = useMemo(() => dailySales.map(day => {
                const items = Object.entries(day.items || {})
                    .map(([key, item]) => ({ key, ...item }))
                    .filter(item => item.qty > 0)
                    .sort((a, b) => b.qty - a.qty);
                const freeItems = Object.entries(day.freeItems || {})
                    .map(([key, item]) => ({ key, ...item }))
                    .filter(item => item.qty > 0)
                    .sort((a, b) => b.qty - a.qty);
                return {
                    date: day.date,
                    count: day.orderCount || 0,
                    revenue: day.revenue || 0,
                    cancelledCount: day.cancelledCount || 0,
                    cups: cupsIn(day, addonIds),
                    freeCups: freeCupsIn(day),
                    items,
                    freeItems,
                };
            }).sort((a, b) => b.date.localeCompare(a.date)), [dailySales, addonIds]);

            // Months are rolled up from the same day documents, so nothing extra is stored and
            // the comparison covers however much history the day window holds.
            const salesByMonth = useMemo(() => {
                const map = {};
                dailySales.forEach(day => {
                    const month = (day.date || '').slice(0, 7);
                    if (!month) return;
                    if (!map[month]) map[month] = { month, orderCount: 0, cups: 0, freeCups: 0, revenue: 0 };
                    map[month].orderCount += day.orderCount || 0;
                    map[month].cups += cupsIn(day, addonIds);
                    map[month].freeCups += freeCupsIn(day);
                    map[month].revenue += day.revenue || 0;
                });
                const ascending = Object.values(map).sort((a, b) => a.month.localeCompare(b.month));
                return ascending
                    .map((month, index) => {
                        const previous = index > 0 ? ascending[index - 1].revenue : null;
                        return {
                            ...month,
                            change: previous ? Math.round(((month.revenue - previous) / previous) * 100) : null,
                        };
                    })
                    .reverse();
            }, [dailySales, addonIds]);

            const chartMonths = useMemo(() => salesByMonth.slice(0, 6).reverse(), [salesByMonth]);
            const maxMonthRevenue = Math.max(1, ...chartMonths.map(month => month.revenue));

            // Best sellers are ranked by cups over the chosen stretch of days, read from the same
            // per-day tallies. Iced and blended of one drink count together, with the split shown,
            // since "what sells" is a question about the drink.
            const [bestPeriod, setBestPeriod] = useState(7);
            const best = useMemo(() => {
                const start = new Date();
                start.setDate(start.getDate() - (bestPeriod - 1));
                const cutoff = dateKey(start);
                const map = {};
                let revenue = 0;
                dailySales.forEach(day => {
                    if (!day.date || day.date < cutoff) return;
                    revenue += day.revenue || 0;
                    Object.entries(day.items || {}).forEach(([key, item]) => {
                        if (!(item.qty > 0) || isAddonTally(key, item, addonIds)) return;
                        if (!map[item.name]) map[item.name] = { name: item.name, qty: 0, revenue: 0, byServe: {} };
                        const entry = map[item.name];
                        entry.qty += item.qty;
                        entry.revenue += item.revenue || 0;
                        if (item.serveType) entry.byServe[item.serveType] = (entry.byServe[item.serveType] || 0) + item.qty;
                    });
                });
                const ranked = Object.values(map).sort((a, b) => b.qty - a.qty || b.revenue - a.revenue);
                return { ranked, cups: ranked.reduce((sum, item) => sum + item.qty, 0), revenue };
            }, [dailySales, bestPeriod, addonIds]);

                        if (item.serveType) entry.byServe[item.serveType] = (entry.byServe[item.serveType] || 0) + item.qty;
                        cups += item.qty;
                        value += worth;

            const freeCupsAllTime = useMemo(() => dailySales.reduce((sum, day) => sum + freeCupsIn(day), 0), [dailySales]);

            return (

                                <p className="text-[11px] text-stone-400">

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100 space-y-2">
                        <h3 className="font-bold text-stone-800 mb-2 text-sm uppercase tracking-wider text-stone-500">สรุปยอดขายรายวัน</h3>

        // Money in and out of the shop: takings from orders plus anything logged by hand, set
        // against what was spent. It's where staff key entries in, so it gets its own page
        // rather than sitting under the read-only sales report.
        function CashbookView({ orders, cashbook, dailySales, salesSummary, cashbookSummary, showToast, onRequestCancel }) {
            const [type, setType] = useState('income');
            const [entryDate, setEntryDate] = useState(() => dateKey(new Date()));
            const [note, setNote] = useState('');
            const [amount, setAmount] = useState('');

            // Income is sales revenue plus any manually-logged income (e.g. cash income outside
            // the ordering flow); expense is manual only since nothing else in the app spends money.
            // A day's takings come from its rolled-up total, while the individual sale lines are
            // drawn from the recent orders still in memory — so older days show the figure without
            // the itemised rows rather than a figure that quietly shrinks as orders age out.
            const ledgerByDay = useMemo(() => {
                const map = {};
                const dayOf = (date) => {
                    if (!map[date]) map[date] = { date, salesRevenue: 0, manualIncome: 0, expense: 0, orders: [], entries: [] };
                    return map[date];
                };
                dailySales.forEach(day => {
                    const target = dayOf(day.date);
                    target.salesRevenue = day.revenue || 0;
                    target.manualIncome = day.manualIncome || 0;
                    target.expense = day.manualExpense || 0;
                });
                orders.forEach(order => {
                    if (order.status === 'cancelled') return;
                    dayOf(orderDayKey(order)).orders.push(order);
                });
                cashbook.forEach(entry => { dayOf(entry.date).entries.push(entry); });
                return Object.values(map)
                    .map(day => ({ ...day, income: day.salesRevenue + day.manualIncome, net: day.salesRevenue + day.manualIncome - day.expense }))
                    .sort((a, b) => b.date.localeCompare(a.date));
            }, [dailySales, orders, cashbook]);

            const grandTotals = useMemo(() => {
                const salesRevenue = salesSummary.revenue || 0;
                const manualIncome = cashbookSummary.income || 0;
                return {
                    salesRevenue,
                    manualIncome,
                    income: salesRevenue + manualIncome,
                    expense: cashbookSummary.expense || 0,
                };
            }, [salesSummary, cashbookSummary]);

            const handleAddEntry = (e) => {
                e.preventDefault();
                const amt = parseFloat(amount);
                if (!amt || amt <= 0 || !note.trim() || !entryDate) return;
                const entry = { type, amount: amt, note: note.trim(), date: entryDate };
                db.collection('cashbook').add({
                    ...entry,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                }).then(() => {
                    setNote('');
                    setAmount('');
                    showToast(type === 'income' ? 'บันทึกรายรับสำเร็จ' : 'บันทึกรายจ่ายสำเร็จ');
                    return recordCashbook(entryDate, entry, 1);
                }).catch(() => showToast('บันทึกไม่สำเร็จ', 'error'));
            };

            const handleDeleteEntry = (entry) => {
                db.collection('cashbook').doc(entry.id).delete()
                    .then(() => recordCashbook(entry.date, entry, -1))
                    .then(() => showToast('ลบรายการเรียบร้อยแล้ว'))
                    .catch(() => showToast('ลบไม่สำเร็จ', 'error'));
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">

                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100 space-y-5">
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4">
                                <p className="text-xs text-emerald-700 font-semibold">รายรับรวมทั้งหมด</p>
                                <p className="text-xl font-extrabold text-emerald-700 mt-1">{grandTotals.income.toLocaleString()} บาท</p>
                                <p className="text-[11px] text-emerald-600/80 mt-1">ยอดขาย {grandTotals.salesRevenue.toLocaleString()} + รายรับอื่น {grandTotals.manualIncome.toLocaleString()}</p>
                            </div>
                            <div className="bg-red-50 border border-red-200 rounded-2xl p-4">
                                <p className="text-xs text-red-600 font-semibold">รายจ่ายรวมทั้งหมด</p>
                                <p className="text-xl font-extrabold text-red-600 mt-1">{grandTotals.expense.toLocaleString()} บาท</p>
                            </div>
                            <div className={`rounded-2xl p-4 border ${grandTotals.income - grandTotals.expense >= 0 ? 'bg-amber-50 border-amber-200' : 'bg-red-50 border-red-200'}`}>
                                <p className="text-xs font-semibold text-stone-500">คงเหลือสุทธิ</p>
                                <p className={`text-xl font-extrabold mt-1 ${grandTotals.income - grandTotals.expense >= 0 ? 'text-amber-700' : 'text-red-600'}`}>

                                    type="button"

                            />
                            <input

                                เพิ่ม
                            </button>
                        </form>

                        {ledgerByDay.length === 0 ? (
                            <p className="text-sm text-stone-400 text-center py-6">ยังไม่มีรายการรายรับ-รายจ่าย</p>
                        ) : (
                            <div className="space-y-4">
                                {ledgerByDay.map(day => (
                                    <div key={day.date} className="border border-stone-100 rounded-2xl overflow-hidden">
                                        <div className="bg-stone-50 px-4 py-2.5 flex flex-wrap gap-x-3 justify-between items-center text-xs font-semibold text-stone-500">
                                            <span>{day.date}</span>
                                            <span>
                                                รับ {day.income.toLocaleString()} · จ่าย {day.expense.toLocaleString()} · สุทธิ {day.net.toLocaleString()} บาท
                                            </span>
                                        </div>
                                        <div className="divide-y divide-stone-50">
                                            {day.orders.map(order => (
                                                <div key={order.id} className="px-4 py-2.5 flex items-center justify-between text-sm gap-3 bg-emerald-50/40">
                                                    <span className="text-stone-600 min-w-0 truncate flex items-center gap-1.5">
                                                        <Icon name="shopping-bag" className="w-3.5 h-3.5 text-emerald-600 shrink-0"></Icon>
                                                        {order.items.every(i => i.free) ? 'แก้วฟรี' : 'ขาย'} #{order.orderNumber} · {order.items.map(i => `${itemLabel(i)} x${i.qty}${i.free ? ' (ฟรี)' : ''}`).join(', ')}
                                                    </span>
                                                    <div className="flex items-center space-x-3 shrink-0">
                                                        <span className="font-semibold text-emerald-600">+{(order.total || 0).toLocaleString()} บาท</span>
                                                        <button onClick={() => onRequestCancel(order)} className="text-stone-300 hover:text-red-500 transition-colors">
                                                            <Icon name="x" className="w-4 h-4"></Icon>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                            {day.entries.map(entry => (
                                                <div key={entry.id} className="px-4 py-2.5 flex items-center justify-between text-sm gap-3">
                                                    <span className="text-stone-600 min-w-0 truncate">{entry.note}</span>
                                                    <div className="flex items-center space-x-3 shrink-0">
                                                        <span className={`font-semibold ${entry.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>
                                                            {entry.type === 'income' ? '+' : '-'}{entry.amount.toLocaleString()} บาท
                                                        </span>
                                                        <button onClick={() => handleDeleteEntry(entry)} className="text-stone-300 hover:text-red-500 transition-colors">
                                                            <Icon name="x" className="w-4 h-4"></Icon>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SettingsView({ rewards, setRewards, showToast }) {
            const [newRewardName, setNewRewardName] = useState('');
            const [newRewardPts, setNewRewardPts] = useState('');

            const handleAddReward = (e) => {
                e.preventDefault();
                if (!newRewardName || !newRewardPts) return;
                const newR = {
                    id: 'r_' + Date.now(),
                    name: newRewardName,
                    pointsRequired: parseInt(newRewardPts, 10),
                    icon: 'gift'
                };
                setRewards([...rewards, newR]);
                setNewRewardName('');
                setNewRewardPts('');
                showToast('เพิ่มรายการของรางวัลสำเร็จ');
            };

            const handleDeleteReward = (id) => {
                setRewards(rewards.filter(r => r.id !== id));
                showToast('ลบของรางวัลเรียบร้อยแล้ว');
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <h2 className="text-2xl font-bold text-stone-800">จัดการของรางวัล</h2>
                        <p className="text-xs text-stone-400 mt-0.5">กำหนดรายการและจำนวนแต้มที่ใช้แลก</p>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <h3 className="font-bold text-stone-800 mb-4 text-sm uppercase tracking-wider text-stone-500">
                            + เพิ่มของรางวัลใหม่
                        </h3>
                        <form onSubmit={handleAddReward} className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                            <input
                                type="text"
                                placeholder="ชื่อของรางวัล (เช่น ฟรี ชาเขียวเย็น 1 แก้ว)"
                                value={newRewardName}
                                onChange={(e) => setNewRewardName(e.target.value)}
                                required
                                className="sm:col-span-7 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <input
                                type="number"
                                placeholder="จำนวนแต้ม"
                                value={newRewardPts}
                                onChange={(e) => setNewRewardPts(e.target.value)}
                                required
                                min="1"
                                className="sm:col-span-3 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <button
                                type="submit"
                                className="sm:col-span-2 bg-amber-300 hover:bg-amber-400 text-amber-950 font-bold py-3 rounded-2xl text-sm transition-all shadow-sm active:scale-95"
                            >
                                เพิ่มรางวัล
                            </button>
                        </form>
                    </div>

                    <div className="space-y-3">
                        {rewards.map(reward => (
                            <div key={reward.id} className="bg-white p-5 rounded-3xl shadow-sm border border-stone-100 flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center">
                                        <Icon name="gift" className="w-5 h-5"></Icon>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-stone-800 text-sm">{reward.name}</h4>
                                        <span className="text-xs text-amber-700 font-semibold">{reward.pointsRequired} แต้มสะสม</span>
                                    </div>
                                </div>
                                <button
                                    onClick={() => handleDeleteReward(reward.id)}
                                    className="p-2.5 text-stone-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all"
                                >
                                    <Icon name="trash-2" className="w-5 h-5"></Icon>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
