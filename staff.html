    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'stamp') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start(); osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'redeem') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'tap') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                    osc.start(); osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'alert') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(660, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
                    osc.frequency.setValueAtTime(660, ctx.currentTime + 0.24);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.log("Audio not supported or allowed yet");
            }
        };

        // A walk-in sale can register a member from a phone number alone, so the name may be blank.
        function memberLabel(customer) {
            return customer.name || 'ไม่ระบุชื่อ';
        }

        function timeString(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function dateKey(date) {
            return timeString(date).split(' ')[0];
        }

        const THAI_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

        // "2026-09" reads as "ก.ย. 69" — Thai short month with the Buddhist-era year.
        function monthLabel(month) {
            const [year, index] = month.split('-');
            return `${THAI_MONTHS[Number(index) - 1]} ${String(Number(year) + 543).slice(-2)}`;
        }

        // Sales totals live as one small document per day plus a running all-time doc. The
        // report reads those instead of scanning the orders collection, so it stays correct
        // and cheap however many thousands of orders pile up over the months. Each day also
        // keeps a per-item tally, which is what makes "what sold today" answerable without
        // re-reading the orders themselves.
        // direction: +1 when a sale is rung up, -1 when one is voided.
        function recordSale(dayKey, order, direction) {
            const inc = firebase.firestore.FieldValue.increment;
            const items = {};
            (order.items || []).forEach(i => {
                items[`${i.menuId}__${i.serveType || 'plain'}`] = {
                    name: i.name,
                    serveType: i.serveType || '',
                    qty: inc(direction * i.qty),
                    revenue: inc(direction * i.qty * i.price),
                };
            });
            const batch = db.batch();
            batch.set(db.collection('dailySales').doc(dayKey), {
                date: dayKey,
                orderCount: inc(direction),
                cancelledCount: inc(direction < 0 ? 1 : 0),
                revenue: inc(direction * (order.total || 0)),
                items,
            }, { merge: true });
            batch.set(db.collection('summary').doc('sales'), {
                orderCount: inc(direction),
                revenue: inc(direction * (order.total || 0)),
            }, { merge: true });
            return batch.commit();
        }

        // A member's phone number is their document id, so one read answers "is this a member?"
        // exactly — no need to hold every member in memory to find them.
        function lookupCustomer(phone) {
            return db.collection('customers').doc(phone).get()
                .then(doc => (doc.exists ? { id: doc.id, ...doc.data() } : null))
                .catch(() => null);
        }

        // Manually-logged income and expense roll up the same way as sales, into the day's
        // document and a running total, so the headline figures stay right once the cashbook
        // has more entries than any one screen would load.
        // direction: +1 when an entry is logged, -1 when it is removed.
        function recordCashbook(dayKey, entry, direction) {
            const inc = firebase.firestore.FieldValue.increment;
            const amount = direction * (entry.amount || 0);
            const income = entry.type === 'income' ? amount : 0;
            const expense = entry.type === 'income' ? 0 : amount;
            const batch = db.batch();
            batch.set(db.collection('dailySales').doc(dayKey), {
                date: dayKey,
                manualIncome: inc(income),
                manualExpense: inc(expense),
            }, { merge: true });
            batch.set(db.collection('summary').doc('cashbook'), {
                income: inc(income),
                expense: inc(expense),
            }, { merge: true });
            return batch.commit();
        }

        // A drink can cost more blended than iced, so the price follows the chosen option and
        // falls back to the item's plain price when the shop hasn't set one.
        function priceFor(item, serveType) {
            const perType = item.servePrices && serveType ? item.servePrices[serveType] : null;
            return typeof perType === 'number' ? perType : item.price;
        }

        // Which day's takings an order belongs to. Newer orders carry the key they were rung
        // up on; older ones predate the field and fall back to their timestamp.
        function orderDayKey(order) {
            if (order.dayKey) return order.dayKey;
            if (!order.createdAt) return dateKey(new Date());
            return dateKey(order.createdAt.toDate ? order.createdAt.toDate() : new Date(order.createdAt));
        }

        // Same daily counter the customer ordering page claims from, so walk-in and online
        // orders share one run of short order numbers per day.
        async function getNextOrderNumber() {
            const today = new Date();
            const dayKey = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
            const ref = db.collection('counters').doc(dayKey);
            return db.runTransaction(async (t) => {
                const snap = await t.get(ref);
                const value = (snap.exists ? snap.data().count : 0) + 1;
                t.set(ref, { count: value });
                return value;
            });
        }

        // Credits a walk-in sale to the member's card (one point per item), registering the
        // phone as a new member if it hasn't been seen before.
        async function earnPointsForOrder(phone, name, itemCount, orderNumber) {
            const ref = db.collection('customers').doc(phone);
            const visitTime = timeString(new Date());
            await db.runTransaction(async (t) => {
                const snap = await t.get(ref);
                if (!snap.exists) {
                    t.set(ref, {
                        phone, name: name || '', points: itemCount, totalEarned: itemCount,
                        totalDrinks: itemCount, orderCount: 1, lastVisit: visitTime,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                    return;
                }
                const data = snap.data();
                const updated = {
                    points: (data.points || 0) + itemCount,
                    totalEarned: (data.totalEarned || 0) + itemCount,
                    totalDrinks: (data.totalDrinks || 0) + itemCount,
                    orderCount: (data.orderCount || 0) + 1,
                    lastVisit: visitTime,
                };
                if (name && !data.name) updated.name = name;
                t.update(ref, updated);
            });
            await db.collection('loyaltyEvents').add({
                customerName: name || '', phone, type: 'ADD', amount: itemCount,
                note: `ขายหน้าร้าน #${orderNumber} (+${itemCount})`, time: visitTime,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
        }

        // Undoes everything a cancelled order gave the member: the points it granted (walk-in
        // sales only) and the visit counters, which the customer ordering page raises for every
        // order whether or not points were involved.
        async function reversePointsForOrder(order) {
            if (!order.phone) return;
            const points = order.pointsAwarded || 0;
            const itemCount = order.itemCount || (order.items || []).reduce((sum, i) => sum + (i.qty || 0), 0);
            const ref = db.collection('customers').doc(order.phone);
            const visitTime = timeString(new Date());
            await db.runTransaction(async (t) => {
                const snap = await t.get(ref);
                if (!snap.exists) return;
                const data = snap.data();
                t.update(ref, {
                    points: Math.max(0, (data.points || 0) - points),
                    totalEarned: Math.max(0, (data.totalEarned || 0) - points),
                    totalDrinks: Math.max(0, (data.totalDrinks || 0) - itemCount),
                    orderCount: Math.max(0, (data.orderCount || 0) - 1),
                });
            });
            if (points > 0) {
                await db.collection('loyaltyEvents').add({
                    customerName: order.customerName || '', phone: order.phone, type: 'REDEEM', amount: points,
                    note: `ยกเลิกออเดอร์ #${order.orderNumber} (-${points})`, time: visitTime,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
            }
        }

        const INITIAL_REWARDS = [
            { id: 'r1', name: 'ฟรี! กาแฟ/เครื่องดื่ม 1 แก้ว (เมนูใดก็ได้)', pointsRequired: 10, icon: 'coffee' },
            { id: 'r2', name: 'ส่วนลด 50 บาท', pointsRequired: 5, icon: 'tag' },
            { id: 'r3', name: 'ฟรี! เบเกอรี่/ขนมหวาน 1 ชิ้น', pointsRequired: 12, icon: 'cake' }
        ];

        const CATEGORY_ICONS = {
            'กาแฟ': 'coffee',
            'เครื่องดื่มอื่นๆ': 'cup-soda',
            'เบเกอรี่': 'cake',
        };

        const ORDER_STATUS_LABEL = {
            new: 'ใหม่', preparing: 'กำลังทำ', ready: 'พร้อมเสิร์ฟ', done: 'เสร็จแล้ว', cancelled: 'ยกเลิก',
        };

        // How a drink is served. A menu item carries the options it can be made in, so a
        // promotion can later target just the blended ones without guessing from the name.
        const SERVE_TYPES = [
            { key: 'iced', label: 'เย็น' },
            { key: 'blended', label: 'ปั่น' },
        ];

        function serveLabel(key) {
            const type = SERVE_TYPES.find(t => t.key === key);
            return type ? type.label : '';
        }

        function serveOptions(item) {
            return SERVE_TYPES.map(t => t.key).filter(k => (item.serveTypes || []).includes(k));
        }

        // Cart keys carry the chosen option so เย็น and ปั่น of the same drink stay separate lines.
        function cartKey(menuId, serve) {
            return serve ? `${menuId}|${serve}` : menuId;
        }

        function itemLabel(item) {
            return item.serveType ? `${item.name} (${serveLabel(item.serveType)})` : item.name;
        }

        function timeAgo(timestamp) {
            if (!timestamp) return 'เมื่อสักครู่';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const mins = Math.max(0, Math.round((Date.now() - date.getTime()) / 60000));
            if (mins < 1) return 'เมื่อสักครู่';
            if (mins < 60) return `${mins} นาทีที่แล้ว`;
            return `${Math.floor(mins / 60)} ชม. ${mins % 60} นาทีที่แล้ว`;
        }

        // Renders a lucide icon via dangerouslySetInnerHTML computed at render time, instead of
        // the library's global DOM-scanning createIcons() (which replaces <i> nodes out from
        // under React) or an imperative ref+effect mutation (which can still race a fast-arriving
        // re-render before the effect runs). Setting the HTML synchronously in the same render
        // keeps the DOM fully inside React's own bookkeeping, so there's nothing left to race.
        // The markup for a given icon never changes, so build it once instead of creating and
        // serialising a DOM node on every render — the menu grid and stamp card alone redraw
        // dozens of icons on each keystroke.
        const iconMarkup = {};
        function toPascalCase(str) {
            return str.split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('');
        }
        function svgFor(name) {
            // Never cache a miss caused by the library not being ready, or the icon would stay
            // blank for good once lucide finishes loading.
            if (!window.lucide) return null;
            if (!(name in iconMarkup)) {
                const iconData = window.lucide.icons[toPascalCase(name)];
                iconMarkup[name] = iconData ? window.lucide.createElement(iconData).outerHTML : null;
            }
            return iconMarkup[name];
        }
        function Icon({ name, className = '' }) {
            const svg = svgFor(name);
            if (!svg) return <span className={`inline-flex ${className}`}></span>;
            return <span className={`inline-flex ${className}`} dangerouslySetInnerHTML={{ __html: svg }}></span>;
        }

        function App() {
            const [activeTab, setActiveTab] = useState('orders'); // 'orders', 'sale', 'pos', 'customers', 'history', 'reports', 'menu', 'settings'
            const [cancellingOrder, setCancellingOrder] = useState(null);
            const [customers, setCustomers] = useState([]);
            const [rewards, setRewards] = useState(() => {
                const saved = localStorage.getItem('coffee_rewards');
                return saved ? JSON.parse(saved) : INITIAL_REWARDS;
            });
            const [history, setHistory] = useState([]);

            const [phoneInput, setPhoneInput] = useState('');
            const [selectedPhone, setSelectedPhone] = useState(null);
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            const [showNewCustomerModal, setShowNewCustomerModal] = useState(false);
            const [newCustomerName, setNewCustomerName] = useState('');
            const [showRedeemModal, setShowRedeemModal] = useState(false);
            const [notification, setNotification] = useState(null);
            const [maxStampsPerCard, setMaxStampsPerCard] = useState(10);

            const [orders, setOrders] = useState([]);
            const [menuItems, setMenuItems] = useState([]);
            const [cashbook, setCashbook] = useState([]);
            const [dailySales, setDailySales] = useState([]);
            const [salesSummary, setSalesSummary] = useState({ orderCount: 0, revenue: 0 });
            const [cashbookSummary, setCashbookSummary] = useState({ income: 0, expense: 0 });
            const seenOrderIds = useRef(null);

            useEffect(() => {
                localStorage.setItem('coffee_rewards', JSON.stringify(rewards));
            }, [rewards]);

            // Membership records, keyed by phone (the doc id); shared with the customer ordering
            // page so a walk-in stamp and an online order both land on the same member record.
            // Nothing is seeded here: an empty list means the shop genuinely has no members yet,
            // and writing sample people into a live shop's database would be worse than blank.
            // Only the recently-active members are held for the list view; anyone older is
            // still reachable because every lookup goes to the document by phone number.
            useEffect(() => {
                const unsub = db.collection('customers').orderBy('lastVisit', 'desc').limit(200)
                    .onSnapshot((snap) => {
                        setCustomers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                return unsub;
            }, []);

            // Watch the member being served, so their points update live even when they are
            // not among the members loaded above.
            useEffect(() => {
                if (!selectedPhone) {
                    setSelectedCustomer(null);
                    return;
                }
                const unsub = db.collection('customers').doc(selectedPhone).onSnapshot((doc) => {
                    setSelectedCustomer(doc.exists ? { id: doc.id, ...doc.data() } : null);
                });
                return unsub;
            }, [selectedPhone]);

            // Log of manual stamp/redeem actions from this POS (append-only).
            useEffect(() => {
                const unsub = db.collection('loyaltyEvents').orderBy('createdAt', 'desc').limit(100)
                    .onSnapshot((snap) => {
                        setHistory(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                return unsub;
            }, []);

            // Rolled-up takings: a few months of day documents for the breakdown, plus one
            // all-time doc for the headline figure. Both stay small no matter the order volume.
            useEffect(() => {
                const unsub = db.collection('dailySales').orderBy('date', 'desc').limit(120)
                    .onSnapshot((snap) => {
                        setDailySales(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                return unsub;
            }, []);

            useEffect(() => {
                const unsub = db.collection('summary').doc('sales').onSnapshot((doc) => {
                    setSalesSummary(doc.exists ? doc.data() : { orderCount: 0, revenue: 0 });
                });
                return unsub;
            }, []);

            useEffect(() => {
                const unsub = db.collection('summary').doc('cashbook').onSnapshot((doc) => {
                    setCashbookSummary(doc.exists ? doc.data() : { income: 0, expense: 0 });
                });
                return unsub;
            }, []);

            // Live orders feed; pings a sound when a genuinely new order arrives (not on first load).
            // Only recent orders are needed: the board works on open ones and the report takes its
            // totals from dailySales, so this window never has to grow with the shop's history.
            useEffect(() => {
                const unsub = db.collection('orders').orderBy('createdAt', 'desc').limit(200)
                    .onSnapshot((snap) => {
                        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        if (seenOrderIds.current === null) {
                            seenOrderIds.current = new Set(list.map(o => o.id));
                        } else {
                            const hasNew = list.some(o => o.status === 'new' && !seenOrderIds.current.has(o.id));
                            if (hasNew) playSound('alert');
                            seenOrderIds.current = new Set(list.map(o => o.id));
                        }
                        setOrders(list);
                    });
                return unsub;
            }, []);

            useEffect(() => {
                const unsub = db.collection('menu').orderBy('sortOrder').onSnapshot((snap) => {
                    setMenuItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, []);

            // Manual daily income/expense entries for the shop's cashbook report.
            useEffect(() => {
                const unsub = db.collection('cashbook').orderBy('createdAt', 'desc').limit(500)
                    .onSnapshot((snap) => {
                        setCashbook(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, []);

            const showToast = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const formatPhone = (val) => {
                if (!val) return '';
                const clean = val.replace(/\D/g, '');
                if (clean.length <= 3) return clean;
                if (clean.length <= 6) return `${clean.slice(0, 3)}-${clean.slice(3)}`;
                return `${clean.slice(0, 3)}-${clean.slice(3, 6)}-${clean.slice(6, 10)}`;
            };

            const handleNumpad = (digit) => {
                playSound('tap');
                if (digit === 'del') {
                    setPhoneInput(prev => prev.slice(0, -1));
                } else if (digit === 'clear') {
                    setPhoneInput('');
                    setSelectedPhone(null);
                } else {
                    if (phoneInput.length < 10) {
                        const updated = phoneInput + digit;
                        setPhoneInput(updated);
                        if (updated.length === 10) {
                            lookupCustomer(updated).then(found => found && setSelectedPhone(updated));
                        }
                    }
                }
            };

            const handleSearchCustomer = () => {
                if (!phoneInput) return;
                const cleanPhone = phoneInput.replace(/\D/g, '');
                lookupCustomer(cleanPhone).then(found => {
                    if (found) {
                        setSelectedPhone(cleanPhone);
                        showToast(`พบข้อมูลสมาชิก: ${memberLabel(found)}`);
                    } else {
                        setSelectedPhone(null);
                        setShowNewCustomerModal(true);
                    }
                });
            };

            const handleAddPoints = (amount = 1) => {
                if (!selectedCustomer) return;
                playSound('stamp');
                const visitTime = timeString(new Date());
                db.collection('customers').doc(selectedCustomer.id).update({
                    points: firebase.firestore.FieldValue.increment(amount),
                    totalEarned: firebase.firestore.FieldValue.increment(amount),
                    lastVisit: visitTime,
                }).then(() => {
                    return db.collection('loyaltyEvents').add({
                        customerName: selectedCustomer.name, phone: selectedCustomer.phone,
                        type: 'ADD', amount, note: `สะสมแต้ม (+${amount})`,
                        time: visitTime, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                }).then(() => {
                    showToast(`สะสมแต้มสำเร็จ (+${amount} แต้ม)`);
                }).catch(() => showToast('บันทึกแต้มไม่สำเร็จ', 'error'));
            };

            // A full card is always spent, so the customer starts a fresh one either way. The
            // choice is only whether the free drink is poured now or banked on their account
            // for a later visit.
            const handleCompleteCard = (keep) => {
                if (!selectedCustomer || (selectedCustomer.points || 0) < maxStampsPerCard) return;
                playSound('redeem');
                const visitTime = timeString(new Date());
                const update = {
                    points: firebase.firestore.FieldValue.increment(-maxStampsPerCard),
                    lastVisit: visitTime,
                };
                // Banked drinks are counted as received only when they are actually handed over.
                if (keep) update.freeDrinks = firebase.firestore.FieldValue.increment(1);
                else update.freeDrinksRedeemed = firebase.firestore.FieldValue.increment(1);
                db.collection('customers').doc(selectedCustomer.id).update(update).then(() => {
                    return db.collection('loyaltyEvents').add({
                        customerName: selectedCustomer.name, phone: selectedCustomer.phone,
                        type: 'REDEEM', amount: maxStampsPerCard,
                        note: keep ? 'บัตรเต็ม: เก็บเครื่องดื่มฟรีไว้ใช้ทีหลัง' : 'บัตรเต็ม: รับเครื่องดื่มฟรีทันที',
                        time: visitTime, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                }).then(() => {
                    showToast(keep ? 'เก็บสิทธิ์เครื่องดื่มฟรีไว้ให้แล้ว' : 'รับเครื่องดื่มฟรีเรียบร้อย');
                }).catch(() => showToast('ทำรายการไม่สำเร็จ', 'error'));
            };

            const handleUseFreeDrink = () => {
                if (!selectedCustomer || !(selectedCustomer.freeDrinks > 0)) return;
                playSound('redeem');
                const visitTime = timeString(new Date());
                db.collection('customers').doc(selectedCustomer.id).update({
                    freeDrinks: firebase.firestore.FieldValue.increment(-1),
                    freeDrinksRedeemed: firebase.firestore.FieldValue.increment(1),
                    lastVisit: visitTime,
                }).then(() => {
                    return db.collection('loyaltyEvents').add({
                        customerName: selectedCustomer.name, phone: selectedCustomer.phone,
                        type: 'REDEEM', amount: 0,
                        note: 'ใช้เครื่องดื่มฟรีที่เก็บไว้', time: visitTime,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                }).then(() => {
                    showToast('ใช้เครื่องดื่มฟรีเรียบร้อย');
                }).catch(() => showToast('ทำรายการไม่สำเร็จ', 'error'));
            };

            const handleRegisterCustomer = async (e) => {
                e.preventDefault();
                if (!phoneInput || !newCustomerName) return;
                const cleanPhone = phoneInput.replace(/\D/g, '');
                if (await lookupCustomer(cleanPhone)) {
                    showToast('เบอร์โทรศัพท์นี้ถูกลงทะเบียนแล้ว', 'error');
                    return;
                }
                const visitTime = timeString(new Date());
                const newCustomer = {
                    phone: cleanPhone, name: newCustomerName, points: 1, totalEarned: 1,
                    totalDrinks: 0, orderCount: 0, lastVisit: visitTime,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                };
                db.collection('customers').doc(cleanPhone).set(newCustomer).then(() => {
                    setSelectedPhone(cleanPhone);
                    setShowNewCustomerModal(false);
                    setNewCustomerName('');
                    playSound('stamp');
                    showToast(`สมัครสมาชิกสำเร็จ! ได้รับแต้มต้อนรับ +1 แต้ม`);
                    return db.collection('loyaltyEvents').add({
                        customerName: newCustomer.name, phone: cleanPhone, type: 'ADD', amount: 1,
                        note: 'สมัครสมาชิกใหม่ (+1 แต้มต้อนรับ)', time: visitTime,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                }).catch(() => showToast('สมัครสมาชิกไม่สำเร็จ', 'error'));
            };

            const handleRedeemReward = (reward) => {
                if (!selectedCustomer || selectedCustomer.points < reward.pointsRequired) {
                    showToast('แต้มสะสมไม่เพียงพอ', 'error');
                    return;
                }
                playSound('redeem');
                const visitTime = timeString(new Date());
                db.collection('customers').doc(selectedCustomer.id).update({
                    points: firebase.firestore.FieldValue.increment(-reward.pointsRequired),
                    lastVisit: visitTime,
                }).then(() => {
                    return db.collection('loyaltyEvents').add({
                        customerName: selectedCustomer.name, phone: selectedCustomer.phone,
                        type: 'REDEEM', amount: reward.pointsRequired, note: `แลกรางวัล: ${reward.name}`,
                        time: visitTime, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                }).then(() => {
                    setShowRedeemModal(false);
                    showToast(`แลกรางวัล "${reward.name}" สำเร็จ!`);
                }).catch(() => showToast('แลกรางวัลไม่สำเร็จ', 'error'));
            };

            const updateOrderStatus = (order, status) => {
                db.collection('orders').doc(order.id).update({
                    status,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                }).catch(() => showToast('อัปเดตออเดอร์ไม่สำเร็จ', 'error'));
            };

            // Cancelling voids the sale everywhere at once: the takings for that day drop by
            // the order's total and any points it granted come back off the member's card.
            const confirmCancelOrder = () => {
                const order = cancellingOrder;
                setCancellingOrder(null);
                // Guard against a second cancel (e.g. from another terminal) taking the points twice.
                if (order.status === 'cancelled') return;
                db.collection('orders').doc(order.id).update({
                    status: 'cancelled',
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                }).then(() => Promise.all([
                    recordSale(orderDayKey(order), order, -1),
                    reversePointsForOrder(order),
                ])).then(() => showToast(`ยกเลิกออเดอร์ #${order.orderNumber} แล้ว`))
                    .catch(() => showToast('ยกเลิกออเดอร์ไม่สำเร็จ', 'error'));
            };

            return (
                <div className="flex flex-col md:flex-row h-screen max-h-screen overflow-hidden bg-coffee-50">

                    {notification && (
                        <div className={`fixed top-4 right-4 z-50 px-5 py-3 rounded-2xl shadow-sm font-medium text-white transition-all transform duration-300 flex items-center space-x-2 ${
                            notification.type === 'error' ? 'bg-red-500' : 'bg-emerald-600'
                        }`}>
                            <Icon name={notification.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-5 h-5"></Icon>
                            <span>{notification.msg}</span>
                        </div>
                    )}

                    <aside className="w-full md:w-64 bg-coffee-200 text-coffee-800 flex flex-row md:flex-col justify-between p-3 md:p-5 border-b md:border-b-0 md:border-r border-coffee-300 z-20 shrink-0 overflow-x-auto">
                        <div className="flex items-center space-x-3 md:mb-8 shrink-0">
                            <img src="logo.png" alt="Little Homie" className="w-10 h-10 rounded-full shrink-0" />
                            <div>
                                <h1 className="font-bold text-base leading-tight text-coffee-950">Little Homie POS</h1>
                                <p className="text-[11px] text-coffee-600">ระบบหลังร้านลิทเทิลโฮมมี่</p>
                            </div>
                        </div>

                        <nav className="flex flex-row md:flex-col space-x-1 md:space-x-0 md:space-y-2">
                            <NavButton active={activeTab === 'orders'} onClick={() => setActiveTab('orders')} icon="clipboard-list" label="ออเดอร์" />
                            <NavButton active={activeTab === 'sale'} onClick={() => setActiveTab('sale')} icon="shopping-cart" label="ขายหน้าร้าน" />
                            <NavButton active={activeTab === 'pos'} onClick={() => setActiveTab('pos')} icon="plus-circle" label="บันทึกแต้ม (POS)" />
                            <NavButton active={activeTab === 'customers'} onClick={() => setActiveTab('customers')} icon="users" label="รายชื่อลูกค้า" />
                            <NavButton active={activeTab === 'history'} onClick={() => setActiveTab('history')} icon="history" label="ประวัติทำรายการ" />
                            <NavButton active={activeTab === 'reports'} onClick={() => setActiveTab('reports')} icon="bar-chart-3" label="รายงานประจำวัน" />
                            <NavButton active={activeTab === 'menu'} onClick={() => setActiveTab('menu')} icon="book-open" label="จัดการเมนู" />
                            <NavButton active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} icon="gift" label="จัดการรางวัล" />
                        </nav>

                        <div className="hidden md:block pt-4 border-t border-coffee-300 text-xs text-coffee-700 text-center">
                            <p>Little Homie Coffee</p>
                            <p className="mt-1 text-[10px] text-coffee-500">iPad &amp; iPhone Terminal Ready</p>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-y-auto p-4 md:p-8">
                        {activeTab === 'orders' && (
                            <OrdersBoardView orders={orders} onUpdateStatus={updateOrderStatus} onRequestCancel={setCancellingOrder} />
                            )}

                            {activeTab === 'sale' && (
                            <CounterSaleView
                            menuItems={menuItems}
                            customers={customers}
                            formatPhone={formatPhone}
                            showToast={showToast}
                            />
                        )}

                        {activeTab === 'pos' && (
                            <POSView
                                phoneInput={phoneInput}
                                setPhoneInput={setPhoneInput}
                                handleNumpad={handleNumpad}
                                handleSearchCustomer={handleSearchCustomer}
                                selectedCustomer={selectedCustomer}
                                setSelectedPhone={setSelectedPhone}
                                handleAddPoints={handleAddPoints}
                                handleCompleteCard={handleCompleteCard}
                                handleUseFreeDrink={handleUseFreeDrink}
                                setShowNewCustomerModal={setShowNewCustomerModal}
                                setShowRedeemModal={setShowRedeemModal}
                                formatPhone={formatPhone}
                                maxStampsPerCard={maxStampsPerCard}
                            />
                        )}

                        {activeTab === 'customers' && (
                            <CustomersView
                                customers={customers}
                                formatPhone={formatPhone}
                                showToast={showToast}
                                onSelectCustomer={(c) => {
                                    setSelectedPhone(c.id);
                                    setPhoneInput(c.phone);
                                    setActiveTab('pos');
                                }}
                            />
                        )}

                        {activeTab === 'history' && (
                            <HistoryView history={history} formatPhone={formatPhone} />
                        )}

                        {activeTab === 'reports' && (
                            <ReportsView
                                orders={orders}
                                cashbook={cashbook}
                                dailySales={dailySales}
                                salesSummary={salesSummary}
                                cashbookSummary={cashbookSummary}
                                showToast={showToast}
                                onRequestCancel={setCancellingOrder}
                            />
                        )}

                        {activeTab === 'menu' && (
                            <MenuManageView menuItems={menuItems} showToast={showToast} />
                        )}

                        {activeTab === 'settings' && (
                            <SettingsView
                                rewards={rewards}
                                setRewards={setRewards}
                                showToast={showToast}
                            />
                        )}
                    </main>

                    {showNewCustomerModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-sm border border-stone-100 transform transition-all animate-in fade-in zoom-in duration-200">
                                <div className="flex justify-between items-center mb-5">
                                    <div className="flex items-center space-x-2">
                                        <div className="w-8 h-8 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center">
                                            <Icon name="user-plus" className="w-5 h-5"></Icon>
                                        </div>
                                        <h3 className="text-lg font-bold text-stone-800">สมัครสมาชิกใหม่</h3>
                                    </div>
                                    <button onClick={() => setShowNewCustomerModal(false)} className="text-stone-400 hover:text-stone-600">
                                        <Icon name="x" className="w-6 h-6"></Icon>
                                    </button>
                                </div>

                                <form onSubmit={handleRegisterCustomer} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">เบอร์โทรศัพท์</label>
                                        <input
                                            type="text"
                                            value={formatPhone(phoneInput)}
                                            disabled
                                            className="w-full bg-stone-100 border border-stone-200 rounded-2xl px-4 py-3 font-semibold text-stone-700 text-lg"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">ชื่อ - นามสกุล หรือ ชื่อเล่น</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="เช่น คุณสมชาย, น้องเมย์"
                                            value={newCustomerName}
                                            onChange={(e) => setNewCustomerName(e.target.value)}
                                            className="w-full bg-white border border-stone-300 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none rounded-2xl px-4 py-3 text-stone-800 text-lg"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex items-center space-x-3 text-amber-800 text-sm">
                                        <Icon name="sparkles" className="w-5 h-5 shrink-0 text-amber-600"></Icon>
                                        <span>รับสิทธิ์ฟรี! <strong>+1 แต้มต้อนรับ</strong> ทันทีหลังลงทะเบียน</span>
                                    </div>

                                    <div className="pt-3 flex space-x-3">
                                        <button
                                            type="button"
                                            onClick={() => setShowNewCustomerModal(false)}
                                            className="flex-1 py-3 px-4 border border-stone-200 rounded-2xl font-medium text-stone-600 hover:bg-stone-50"
                                        >
                                            ยกเลิก
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 py-3 px-4 bg-amber-300 hover:bg-amber-400 text-amber-950 rounded-2xl font-medium shadow-sm active:scale-95 transition-all"
                                        >
                                            บันทึกข้อมูล
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showRedeemModal && selectedCustomer && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-lg shadow-sm border border-stone-100 transform transition-all">
                                <div className="flex justify-between items-center mb-4">
                                    <div>
                                        <h3 className="text-xl font-bold text-stone-800">แลกรับของรางวัล</h3>
                                        <p className="text-xs text-stone-500">สำหรับ {memberLabel(selectedCustomer)} (คงเหลือ {selectedCustomer.points} แต้ม)</p>
                                    </div>
                                    <button onClick={() => setShowRedeemModal(false)} className="text-stone-400 hover:text-stone-600">
                                        <Icon name="x" className="w-6 h-6"></Icon>
                                    </button>
                                </div>

                                <div className="space-y-3 max-h-96 overflow-y-auto py-2">
                                    {rewards.map(reward => {
                                        const canRedeem = selectedCustomer.points >= reward.pointsRequired;
                                        return (
                                            <div
                                                key={reward.id}
                                                className={`p-4 rounded-2xl border transition-all flex items-center justify-between ${
                                                    canRedeem
                                                        ? 'border-amber-200 bg-amber-50/60 hover:bg-amber-100/50'
                                                        : 'border-stone-200 bg-stone-50 opacity-60'
                                                }`}
                                            >
                                                <div className="flex items-center space-x-3">
                                                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-white ${canRedeem ? 'bg-amber-600' : 'bg-stone-400'}`}>
                                                        <Icon name={reward.icon || 'gift'} className="w-5 h-5"></Icon>
                                                    </div>
                                                    <div>
                                                        <p className="font-semibold text-stone-800 text-sm">{reward.name}</p>
                                                        <p className="text-xs font-medium text-amber-700">{reward.pointsRequired} แต้มสะสม</p>
                                                    </div>
                                                </div>
                                                <button
                                                    disabled={!canRedeem}
                                                    onClick={() => handleRedeemReward(reward)}
                                                    className={`px-4 py-2 rounded-xl text-xs font-semibold shadow-sm transition-all active:scale-95 ${
                                                        canRedeem
                                                            ? 'bg-emerald-600 text-white hover:bg-emerald-700'
                                                            : 'bg-stone-300 text-stone-500 cursor-not-allowed'
                                                    }`}
                                                >
                                                    {canRedeem ? 'แลกรางวัล' : 'แต้มไม่พอ'}
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="mt-5 pt-3 border-t border-stone-100">
                                    <button
                                        onClick={() => setShowRedeemModal(false)}
                                        className="w-full py-3 bg-stone-100 text-stone-700 font-medium rounded-2xl hover:bg-stone-200"
                                    >
                                        ปิดหน้าต่าง
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {cancellingOrder && (
                        <ConfirmModal
                            title={`ยกเลิกออเดอร์ #${cancellingOrder.orderNumber}?`}
                            message={
                                `ยอด ${(cancellingOrder.total || 0).toLocaleString()} บาท จะถูกตัดออกจากยอดขายและรายรับ` +
                                (cancellingOrder.pointsAwarded > 0 ? ` และคืนแต้มสะสม ${cancellingOrder.pointsAwarded} แต้ม` : '')
                            }
                            confirmLabel="ยกเลิกออเดอร์"
                            onClose={() => setCancellingOrder(null)}
                            onConfirm={confirmCancelOrder}
                        />
                    )}

                </div>
            );
        }

        function ConfirmModal({ title, message, confirmLabel, onClose, onConfirm }) {
            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-sm border border-stone-100 text-center pop-in">
                        <div className="w-14 h-14 mx-auto rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-4">
                            <Icon name="alert-triangle" className="w-6 h-6"></Icon>
                        </div>
                        <h3 className="text-lg font-bold text-stone-800">{title}</h3>
                        <p className="text-sm text-stone-500 mt-1">{message}</p>
                        <div className="pt-5 flex space-x-3">
                            <button
                                onClick={onClose}
                                className="flex-1 py-3 px-4 border border-stone-200 rounded-2xl font-medium text-stone-600 hover:bg-stone-50"
                            >
                                ปิด
                            </button>
                            <button
                                onClick={onConfirm}
                                className="flex-1 py-3 px-4 bg-red-600 hover:bg-red-700 text-white rounded-2xl font-medium shadow-sm active:scale-95 transition-all"
                            >
                                {confirmLabel}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function NavButton({ active, onClick, icon, label }) {
            return (
                <button
                    onClick={onClick}
                    className={`flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-medium transition-all whitespace-nowrap ${
                        active ? 'bg-amber-300 text-amber-900' : 'text-coffee-600 hover:bg-coffee-300 hover:text-coffee-900'
                    }`}
                >
                    <Icon name={icon} className="w-5 h-5"></Icon>
                    <span className="hidden md:inline">{label}</span>
                </button>
            );
        }

        function OrdersBoardView({ orders, onUpdateStatus, onRequestCancel }) {
            const columns = useMemo(() => ({
                new: orders.filter(o => o.status === 'new'),
                preparing: orders.filter(o => o.status === 'preparing'),
                ready: orders.filter(o => o.status === 'ready'),
                past: orders.filter(o => o.status === 'done' || o.status === 'cancelled').slice(0, 15),
            }), [orders]);

            const COLUMN_DEFS = [
                { key: 'new', title: 'ใหม่', color: 'border-red-200 bg-red-50/50', nextLabel: 'รับออเดอร์', nextStatus: 'preparing' },
                { key: 'preparing', title: 'กำลังทำ', color: 'border-amber-200 bg-amber-50/50', nextLabel: 'พร้อมเสิร์ฟ', nextStatus: 'ready' },
                { key: 'ready', title: 'พร้อมเสิร์ฟ', color: 'border-emerald-200 bg-emerald-50/50', nextLabel: 'เสร็จสิ้น', nextStatus: 'done' },
            ];

            return (
                <div className="h-full flex flex-col max-w-7xl mx-auto">
                    <div className="mb-4">
                        <h2 className="text-2xl font-bold text-stone-800">ออเดอร์ลูกค้า</h2>
                        <p className="text-xs text-stone-400 mt-0.5">อัปเดตแบบเรียลไทม์จากหน้าสั่งซื้อของลูกค้า</p>
                    </div>

                    <div className="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4 overflow-y-auto pb-4">
                        {COLUMN_DEFS.map(col => (
                            <div key={col.key} className={`rounded-3xl border p-3 flex flex-col ${col.color} min-h-[200px]`}>
                                <div className="flex items-center justify-between px-2 pb-2">
                                    <h3 className="font-bold text-stone-700 text-sm">{col.title}</h3>
                                    <span className="text-xs font-bold bg-white/70 px-2 py-0.5 rounded-full text-stone-500">{columns[col.key].length}</span>
                                </div>
                                <div className="space-y-3 overflow-y-auto max-h-[60vh]">
                                    {columns[col.key].length === 0 && (
                                        <p className="text-xs text-stone-400 text-center py-6">ไม่มีออเดอร์</p>
                                    )}
                                    {columns[col.key].map(order => (
                                        <div key={order.id} className="bg-white rounded-2xl p-4 shadow-sm border border-stone-100 space-y-2 pop-in">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <p className="font-extrabold text-amber-700 text-lg leading-none">#{order.orderNumber}</p>
                                                    <p className="text-xs text-stone-500 mt-1">
                                                        {order.orderType === 'dine-in' ? `โต๊ะ ${order.tableNumber}` : 'กลับบ้าน'} · {order.customerName}
                                                    </p>
                                                </div>
                                                <span className="text-[10px] text-stone-400">{timeAgo(order.createdAt)}</span>
                                            </div>
                                            <div className="text-xs text-stone-600 space-y-0.5 border-t border-stone-50 pt-2">
                                                {order.items.map((item, idx) => (
                                                    <div key={idx} className="flex justify-between">
                                                        <span>{itemLabel(item)} x{item.qty}</span>
                                                    </div>
                                                ))}
                                            </div>
                                            {order.note && (
                                                <p className="text-[11px] text-amber-700 bg-amber-50 rounded-lg px-2 py-1">หมายเหตุ: {order.note}</p>
                                            )}
                                            <div className="flex justify-between items-center pt-1">
                                                <span className="text-sm font-bold text-stone-700">{order.total} บาท</span>
                                                <div className="flex space-x-1.5">
                                                    <button
                                                        onClick={() => onRequestCancel(order)}
                                                        className="px-2.5 py-1.5 rounded-lg text-[11px] font-medium text-red-500 hover:bg-red-50"
                                                    >
                                                        ยกเลิก
                                                    </button>
                                                    <button
                                                        onClick={() => onUpdateStatus(order, col.nextStatus)}
                                                        className="px-3 py-1.5 rounded-lg text-xs font-bold bg-sky-300 hover:bg-sky-400 text-sky-950 active:scale-95 transition-all"
                                                    >
                                                        {col.nextLabel}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    {columns.past.length > 0 && (
                        <details className="mt-2">
                            <summary className="text-xs font-medium text-stone-400 cursor-pointer px-2">ประวัติล่าสุด ({columns.past.length})</summary>
                            <div className="mt-2 bg-white rounded-2xl border border-stone-100 divide-y divide-stone-50 max-h-64 overflow-y-auto">
                                {columns.past.map(order => (
                                    <div key={order.id} className="p-3 flex justify-between items-center text-sm gap-3">
                                        <span className="text-stone-600 min-w-0 truncate">#{order.orderNumber} · {order.customerName}</span>
                                        <div className="flex items-center space-x-2 shrink-0">
                                            <span className={`text-xs font-medium ${order.status === 'cancelled' ? 'text-red-500' : 'text-emerald-600'}`}>
                                                {ORDER_STATUS_LABEL[order.status]}
                                            </span>
                                            {order.status !== 'cancelled' && (
                                                <button
                                                    onClick={() => onRequestCancel(order)}
                                                    className="px-2.5 py-1 rounded-lg text-[11px] font-medium text-red-500 hover:bg-red-50"
                                                >
                                                    ยกเลิก

                                    </div>
