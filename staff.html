<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        coffee: {
                            50: '#fdf8f6', 100: '#f2e8e5', 200: '#e8d5ce', 300: '#d3b2a7',
                            400: '#b78776', 500: '#9c6252', 600: '#874f41', 700: '#703e33',
                            800: '#5c342b', 900: '#4c2d26', 950: '#281512',
                        },
                        amberGold: '#d97706',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            background-color: #f7f3f0;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }
        .stamp-animation { animation: stampPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes stampPop {
            0% { transform: scale(2.5) rotate(-15deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .pop-in { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 antialiased min-h-screen">
    <div id="root"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2U4eZyXhKjkPG3Ow8jgaMoKEOGYfknDQ",
            authDomain: "littlehome-pos.firebaseapp.com",
            projectId: "littlehome-pos",
            storageBucket: "littlehome-pos.firebasestorage.app",
            messagingSenderId: "763353161948",
            appId: "1:763353161948:web:37eaa7c9b312acbb069419"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'stamp') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start(); osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'redeem') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'tap') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                    osc.start(); osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'alert') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(660, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
                    osc.frequency.setValueAtTime(660, ctx.currentTime + 0.24);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.log("Audio not supported or allowed yet");
            }
        };

        const INITIAL_CUSTOMERS = [
            { id: '1', phone: '0819876543', name: 'คุณสมชาย ใจดี', points: 8, totalEarned: 18, lastVisit: '2026-09-05 14:20' },
            { id: '2', phone: '0891234567', name: 'คุณพลอย สุขสรรค์', points: 10, totalEarned: 30, lastVisit: '2026-09-06 10:15' },
            { id: '3', phone: '0923456789', name: 'คุณกิตติพงษ์', points: 3, totalEarned: 3, lastVisit: '2026-09-04 08:30' },
        ];

        const INITIAL_REWARDS = [
            { id: 'r1', name: 'ฟรี! กาแฟ/เครื่องดื่ม 1 แก้ว (เมนูใดก็ได้)', pointsRequired: 10, icon: 'coffee' },
            { id: 'r2', name: 'ส่วนลด 50 บาท', pointsRequired: 5, icon: 'tag' },
            { id: 'r3', name: 'ฟรี! เบเกอรี่/ขนมหวาน 1 ชิ้น', pointsRequired: 12, icon: 'cake' }
        ];

        const CATEGORY_ICONS = {
            'กาแฟ': 'coffee',
            'เครื่องดื่มอื่นๆ': 'cup-soda',
            'เบเกอรี่': 'cake',
        };

        const ORDER_STATUS_LABEL = {
            new: 'ใหม่', preparing: 'กำลังทำ', ready: 'พร้อมเสิร์ฟ', done: 'เสร็จแล้ว', cancelled: 'ยกเลิก',
        };

        function timeAgo(timestamp) {
            if (!timestamp) return 'เมื่อสักครู่';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const mins = Math.max(0, Math.round((Date.now() - date.getTime()) / 60000));
            if (mins < 1) return 'เมื่อสักครู่';
            if (mins < 60) return `${mins} นาทีที่แล้ว`;
            return `${Math.floor(mins / 60)} ชม. ${mins % 60} นาทีที่แล้ว`;
        }

        function App() {
            const [activeTab, setActiveTab] = useState('orders'); // 'orders', 'pos', 'customers', 'history', 'menu', 'settings'
            const [customers, setCustomers] = useState(() => {
                const saved = localStorage.getItem('coffee_customers');
                return saved ? JSON.parse(saved) : INITIAL_CUSTOMERS;
            });
            const [rewards, setRewards] = useState(() => {
                const saved = localStorage.getItem('coffee_rewards');
                return saved ? JSON.parse(saved) : INITIAL_REWARDS;
            });
            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('coffee_history');
                return saved ? JSON.parse(saved) : [
                    { id: 'h1', time: '2026-09-06 10:15', customerName: 'คุณพลอย สุขสรรค์', phone: '0891234567', type: 'ADD', amount: 1, note: 'สะสมแต้ม (+1)' },
                    { id: 'h2', time: '2026-09-05 14:20', customerName: 'คุณสมชาย ใจดี', phone: '0819876543', type: 'ADD', amount: 2, note: 'สะสมแต้ม (+2)' }
                ];
            });

            const [phoneInput, setPhoneInput] = useState('');
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            const [showNewCustomerModal, setShowNewCustomerModal] = useState(false);
            const [newCustomerName, setNewCustomerName] = useState('');
            const [showRedeemModal, setShowRedeemModal] = useState(false);
            const [notification, setNotification] = useState(null);
            const [maxStampsPerCard, setMaxStampsPerCard] = useState(10);

            const [orders, setOrders] = useState([]);
            const [menuItems, setMenuItems] = useState([]);
            const seenOrderIds = useRef(null);

            useEffect(() => {
                localStorage.setItem('coffee_customers', JSON.stringify(customers));
            }, [customers]);

            useEffect(() => {
                localStorage.setItem('coffee_rewards', JSON.stringify(rewards));
            }, [rewards]);

            useEffect(() => {
                localStorage.setItem('coffee_history', JSON.stringify(history));
            }, [history]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Live orders feed; pings a sound when a genuinely new order arrives (not on first load).
            useEffect(() => {
                const unsub = db.collection('orders').orderBy('createdAt', 'desc').limit(100)
                    .onSnapshot((snap) => {
                        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        if (seenOrderIds.current === null) {
                            seenOrderIds.current = new Set(list.map(o => o.id));
                        } else {
                            const hasNew = list.some(o => o.status === 'new' && !seenOrderIds.current.has(o.id));
                            if (hasNew) playSound('alert');
                            seenOrderIds.current = new Set(list.map(o => o.id));
                        }
                        setOrders(list);
                    });
                return unsub;
            }, []);

            useEffect(() => {
                const unsub = db.collection('menu').orderBy('sortOrder').onSnapshot((snap) => {
                    setMenuItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, []);

            const showToast = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const formatPhone = (val) => {
                if (!val) return '';
                const clean = val.replace(/\D/g, '');
                if (clean.length <= 3) return clean;
                if (clean.length <= 6) return `${clean.slice(0, 3)}-${clean.slice(3)}`;
                return `${clean.slice(0, 3)}-${clean.slice(3, 6)}-${clean.slice(6, 10)}`;
            };

            const handleNumpad = (digit) => {
                playSound('tap');
                if (digit === 'del') {
                    setPhoneInput(prev => prev.slice(0, -1));
                } else if (digit === 'clear') {
                    setPhoneInput('');
                    setSelectedCustomer(null);
                } else {
                    if (phoneInput.length < 10) {
                        const updated = phoneInput + digit;
                        setPhoneInput(updated);
                        if (updated.length === 10) {
                            const found = customers.find(c => c.phone === updated);
                            if (found) setSelectedCustomer(found);
                        }
                    }
                }
            };

            const handleSearchCustomer = () => {
                if (!phoneInput) return;
                const cleanPhone = phoneInput.replace(/\D/g, '');
                const found = customers.find(c => c.phone === cleanPhone);
                if (found) {
                    setSelectedCustomer(found);
                    showToast(`พบข้อมูลสมาชิก: ${found.name}`);
                } else {
                    setSelectedCustomer(null);
                    setShowNewCustomerModal(true);
                }
            };

            const handleAddPoints = (amount = 1) => {
                if (!selectedCustomer) return;
                playSound('stamp');
                const now = new Date();
                const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                const updatedCustomers = customers.map(c => {
                    if (c.id === selectedCustomer.id) {
                        const newPoints = c.points + amount;
                        const newEarned = c.totalEarned + amount;
                        const updated = { ...c, points: newPoints, totalEarned: newEarned, lastVisit: timeString };
                        setSelectedCustomer(updated);
                        return updated;
                    }
                    return c;
                });
                setCustomers(updatedCustomers);

                const newLog = {
                    id: 'h_' + Date.now(),
                    time: timeString,
                    customerName: selectedCustomer.name,
                    phone: selectedCustomer.phone,
                    type: 'ADD',
                    amount: amount,
                    note: `สะสมแต้ม (+${amount})`
                };
                setHistory([newLog, ...history]);
                showToast(`สะสมแต้มสำเร็จ (+${amount} แต้ม)`);
            };

            const handleRegisterCustomer = (e) => {
                e.preventDefault();
                if (!phoneInput || !newCustomerName) return;
                const cleanPhone = phoneInput.replace(/\D/g, '');
                if (customers.some(c => c.phone === cleanPhone)) {
                    showToast('เบอร์โทรศัพท์นี้ถูกลงทะเบียนแล้ว', 'error');
                    return;
                }
                const now = new Date();
                const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                const newCustomer = {
                    id: 'c_' + Date.now(),
                    phone: cleanPhone,
                    name: newCustomerName,
                    points: 1,
                    totalEarned: 1,
                    lastVisit: timeString
                };
                setCustomers([newCustomer, ...customers]);
                setSelectedCustomer(newCustomer);
                setShowNewCustomerModal(false);
                setNewCustomerName('');
                playSound('stamp');
                showToast(`สมัครสมาชิกสำเร็จ! ได้รับแต้มต้อนรับ +1 แต้ม`);
                setHistory([{
                    id: 'h_' + Date.now(),
                    time: timeString,
                    customerName: newCustomer.name,
                    phone: newCustomer.phone,
                    type: 'ADD',
                    amount: 1,
                    note: 'สมัครสมาชิกใหม่ (+1 แต้มต้อนรับ)'
                }, ...history]);
            };

            const handleRedeemReward = (reward) => {
                if (!selectedCustomer || selectedCustomer.points < reward.pointsRequired) {
                    showToast('แต้มสะสมไม่เพียงพอ', 'error');
                    return;
                }
                playSound('redeem');
                const now = new Date();
                const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                const updatedCustomers = customers.map(c => {
                    if (c.id === selectedCustomer.id) {
                        const newPoints = c.points - reward.pointsRequired;
                        const updated = { ...c, points: newPoints, lastVisit: timeString };
                        setSelectedCustomer(updated);
                        return updated;
                    }
                    return c;
                });
                setCustomers(updatedCustomers);
                setHistory([{
                    id: 'h_' + Date.now(),
                    time: timeString,
                    customerName: selectedCustomer.name,
                    phone: selectedCustomer.phone,
                    type: 'REDEEM',
                    amount: reward.pointsRequired,
                    note: `แลกรางวัล: ${reward.name}`
                }, ...history]);
                setShowRedeemModal(false);
                showToast(`แลกรางวัล "${reward.name}" สำเร็จ!`);
            };

            const updateOrderStatus = (order, status) => {
                db.collection('orders').doc(order.id).update({
                    status,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                }).catch(() => showToast('อัปเดตออเดอร์ไม่สำเร็จ', 'error'));
            };

            return (
                <div className="flex flex-col md:flex-row h-screen max-h-screen overflow-hidden bg-stone-100">

                    {notification && (
                        <div className={`fixed top-4 right-4 z-50 px-5 py-3 rounded-2xl shadow-xl font-medium text-white transition-all transform duration-300 flex items-center space-x-2 ${
                            notification.type === 'error' ? 'bg-red-500' : 'bg-emerald-600'
                        }`}>
                            <i data-lucide={notification.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-5 h-5"></i>
                            <span>{notification.msg}</span>
                        </div>
                    )}

                    <aside className="w-full md:w-64 bg-stone-900 text-stone-200 flex flex-row md:flex-col justify-between p-3 md:p-5 shadow-2xl z-20 shrink-0 overflow-x-auto">
                        <div className="flex items-center space-x-3 md:mb-8 shrink-0">
                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white shadow-lg">
                                <i data-lucide="coffee" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-base leading-tight text-white">Little Homie POS</h1>
                                <p className="text-[11px] text-stone-400">ระบบหลังร้านลิทเทิลโฮมมี่</p>
                            </div>
                        </div>

                        <nav className="flex flex-row md:flex-col space-x-1 md:space-x-0 md:space-y-2">
                            <NavButton active={activeTab === 'orders'} onClick={() => setActiveTab('orders')} icon="clipboard-list" label="ออเดอร์" />
                            <NavButton active={activeTab === 'pos'} onClick={() => setActiveTab('pos')} icon="plus-circle" label="บันทึกแต้ม (POS)" />
                            <NavButton active={activeTab === 'customers'} onClick={() => setActiveTab('customers')} icon="users" label="รายชื่อลูกค้า" />
                            <NavButton active={activeTab === 'history'} onClick={() => setActiveTab('history')} icon="history" label="ประวัติทำรายการ" />
                            <NavButton active={activeTab === 'menu'} onClick={() => setActiveTab('menu')} icon="book-open" label="จัดการเมนู" />
                            <NavButton active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} icon="gift" label="จัดการรางวัล" />
                        </nav>

                        <div className="hidden md:block pt-4 border-t border-stone-800 text-xs text-stone-500 text-center">
                            <p>Little Homie Coffee</p>
                            <p className="mt-1 text-[10px] text-stone-600">iPad &amp; iPhone Terminal Ready</p>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-y-auto p-4 md:p-8">
                        {activeTab === 'orders' && (
                            <OrdersBoardView orders={orders} onUpdateStatus={updateOrderStatus} />
                        )}

                        {activeTab === 'pos' && (
                            <POSView
                                phoneInput={phoneInput}
                                setPhoneInput={setPhoneInput}
                                handleNumpad={handleNumpad}
                                handleSearchCustomer={handleSearchCustomer}
                                selectedCustomer={selectedCustomer}
                                setSelectedCustomer={setSelectedCustomer}
                                handleAddPoints={handleAddPoints}
                                setShowNewCustomerModal={setShowNewCustomerModal}
                                setShowRedeemModal={setShowRedeemModal}
                                formatPhone={formatPhone}
                                maxStampsPerCard={maxStampsPerCard}
                            />
                        )}

                        {activeTab === 'customers' && (
                            <CustomersView
                                customers={customers}
                                formatPhone={formatPhone}
                                onSelectCustomer={(c) => {
                                    setSelectedCustomer(c);
                                    setPhoneInput(c.phone);
                                    setActiveTab('pos');
                                }}
                            />
                        )}

                        {activeTab === 'history' && (
                            <HistoryView history={history} formatPhone={formatPhone} />
                        )}

                        {activeTab === 'menu' && (
                            <MenuManageView menuItems={menuItems} showToast={showToast} />
                        )}

                        {activeTab === 'settings' && (
                            <SettingsView
                                rewards={rewards}
                                setRewards={setRewards}
                                showToast={showToast}
                            />
                        )}
                    </main>

                    {showNewCustomerModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl border border-stone-100 transform transition-all animate-in fade-in zoom-in duration-200">
                                <div className="flex justify-between items-center mb-5">
                                    <div className="flex items-center space-x-2">
                                        <div className="w-8 h-8 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center">
                                            <i data-lucide="user-plus" className="w-5 h-5"></i>
                                        </div>
                                        <h3 className="text-lg font-bold text-stone-800">สมัครสมาชิกใหม่</h3>
                                    </div>
                                    <button onClick={() => setShowNewCustomerModal(false)} className="text-stone-400 hover:text-stone-600">
                                        <i data-lucide="x" className="w-6 h-6"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleRegisterCustomer} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">เบอร์โทรศัพท์</label>
                                        <input
                                            type="text"
                                            value={formatPhone(phoneInput)}
                                            disabled
                                            className="w-full bg-stone-100 border border-stone-200 rounded-2xl px-4 py-3 font-semibold text-stone-700 text-lg"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">ชื่อ - นามสกุล หรือ ชื่อเล่น</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="เช่น คุณสมชาย, น้องเมย์"
                                            value={newCustomerName}
                                            onChange={(e) => setNewCustomerName(e.target.value)}
                                            className="w-full bg-white border border-stone-300 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none rounded-2xl px-4 py-3 text-stone-800 text-lg"
                                            autoFocus
                                        />
                                    </div>

                                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex items-center space-x-3 text-amber-800 text-sm">
                                        <i data-lucide="sparkles" className="w-5 h-5 shrink-0 text-amber-600"></i>
                                        <span>รับสิทธิ์ฟรี! <strong>+1 แต้มต้อนรับ</strong> ทันทีหลังลงทะเบียน</span>
                                    </div>

                                    <div className="pt-3 flex space-x-3">
                                        <button
                                            type="button"
                                            onClick={() => setShowNewCustomerModal(false)}
                                            className="flex-1 py-3 px-4 border border-stone-200 rounded-2xl font-medium text-stone-600 hover:bg-stone-50"
                                        >
                                            ยกเลิก
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 py-3 px-4 bg-amber-600 hover:bg-amber-700 text-white rounded-2xl font-medium shadow-lg shadow-amber-600/30 active:scale-95 transition-all"
                                        >
                                            บันทึกข้อมูล
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showRedeemModal && selectedCustomer && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-stone-100 transform transition-all">

        function MenuManageView({ menuItems, showToast }) {
            const [name, setName] = useState('');
            const [category, setCategory] = useState('');
            const [price, setPrice] = useState('');

            const categories = useMemo(() => {
                const set = new Set(menuItems.map(m => m.category));
                return Array.from(set);
            }, [menuItems]);

            const grouped = useMemo(() => {
                const byCat = {};
                menuItems.forEach(item => {
                    if (!byCat[item.category]) byCat[item.category] = [];
                    byCat[item.category].push(item);
                });
                return byCat;
            }, [menuItems]);

            const handleAdd = (e) => {
                e.preventDefault();
                if (!name || !category || !price) return;
                const maxSort = menuItems.reduce((m, i) => Math.max(m, i.sortOrder || 0), 0);
                db.collection('menu').add({
                    name, category, price: parseFloat(price), available: true, sortOrder: maxSort + 1,
                }).then(() => {
                    setName(''); setCategory(''); setPrice('');
                    showToast('เพิ่มเมนูสำเร็จ');
                }).catch(() => showToast('เพิ่มเมนูไม่สำเร็จ', 'error'));
            };

            const toggleAvailable = (item) => {
                db.collection('menu').doc(item.id).update({ available: !item.available }).catch(() => {});
            };

            const updateField = (item, field, value) => {
                db.collection('menu').doc(item.id).update({ [field]: value }).catch(() => {});
            };

            const handleDelete = (item) => {
                db.collection('menu').doc(item.id).delete().then(() => {
                    showToast('ลบเมนูเรียบร้อยแล้ว');
                }).catch(() => showToast('ลบเมนูไม่สำเร็จ', 'error'));
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <h2 className="text-2xl font-bold text-stone-800">จัดการเมนู</h2>
                        <p className="text-xs text-stone-400 mt-0.5">เมนูที่นี่จะแสดงบนหน้าสั่งซื้อของลูกค้าแบบเรียลไทม์</p>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <h3 className="font-bold text-stone-800 mb-4 text-sm uppercase tracking-wider text-stone-500">+ เพิ่มเมนูใหม่</h3>
                        <form onSubmit={handleAdd} className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                            <input
                                type="text" placeholder="ชื่อเมนู" value={name} onChange={e => setName(e.target.value)} required
                                className="sm:col-span-4 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <input
                                type="text" placeholder="หมวดหมู่ เช่น กาแฟ" value={category} onChange={e => setCategory(e.target.value)} required list="category-options"
                                className="sm:col-span-4 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <datalist id="category-options">
                                {categories.map(c => <option key={c} value={c} />)}
                            </datalist>
                            <input
                                type="number" placeholder="ราคา" value={price} onChange={e => setPrice(e.target.value)} required min="0"
                                className="sm:col-span-2 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <button type="submit" className="sm:col-span-2 bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-2xl text-sm transition-all shadow-md shadow-amber-600/20 active:scale-95">
                                เพิ่ม
                            </button>
                        </form>
                    </div>

                    {Object.keys(grouped).map(cat => (
                        <div key={cat} className="space-y-3">
                            <div className="flex items-center space-x-2 px-1">
                                <i data-lucide={CATEGORY_ICONS[cat] || 'utensils'} className="w-4 h-4 text-amber-700"></i>
                                <h3 className="font-bold text-stone-700 text-sm">{cat}</h3>
                            </div>
                            {grouped[cat].map(item => (
                                <div key={item.id} className={`bg-white p-4 rounded-2xl shadow-sm border flex items-center justify-between gap-3 ${item.available === false ? 'opacity-60 border-stone-100' : 'border-stone-100'}`}>
                                    <input
                                        type="text" defaultValue={item.name}
                                        onBlur={(e) => e.target.value !== item.name && updateField(item, 'name', e.target.value)}
                                        className="flex-1 min-w-0 bg-transparent font-semibold text-stone-800 text-sm outline-none focus:bg-stone-50 rounded-lg px-1"
                                    />
                                    <input
                                        type="number" defaultValue={item.price}
                                        onBlur={(e) => Number(e.target.value) !== item.price && updateField(item, 'price', parseFloat(e.target.value) || 0)}
                                        className="w-20 bg-transparent text-amber-700 font-semibold text-sm text-right outline-none focus:bg-stone-50 rounded-lg px-1"
                                    />
                                    <button
                                        onClick={() => toggleAvailable(item)}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 ${item.available === false ? 'bg-stone-100 text-stone-500' : 'bg-emerald-100 text-emerald-700'}`}
                                    >
                                        {item.available === false ? 'หมด' : 'มีขาย'}
                                    </button>
                                    <button onClick={() => handleDelete(item)} className="p-2 text-stone-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all shrink-0">
                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                    </button>
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
            );
        }

                                        >
                                            <span className="text-xl">+3 แต้ม</span>
                                            <span className="text-[11px] text-amber-100 font-normal">ซื้อ 3 แก้ว</span>
                                        </button>
                                    </div>
                                </div>

                            </div>
                        ) : (
                            <div className="bg-white rounded-3xl p-12 shadow-xl border border-stone-100 flex flex-col items-center justify-center text-center h-full space-y-4">
                                <div className="w-20 h-20 bg-stone-100 rounded-3xl flex items-center justify-center text-stone-400">
                                    <i data-lucide="user-search" className="w-10 h-10"></i>
                                </div>
                                <div>
                                    <h3 className="text-lg font-bold text-stone-800">กรอกเบอร์โทรศัพท์ลูกค้า</h3>
                                    <p className="text-stone-400 text-sm max-w-xs mt-1">
                                        พิมพ์เบอร์โทรศัพท์ที่แป้นพิมพ์ด้านซ้ายเพื่อค้นหา หรือ สมัครสมาชิกใหม่
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>

                </div>
            );
        }

        function CustomersView({ customers, formatPhone, onSelectCustomer }) {
            const [searchTerm, setSearchTerm] = useState('');
            const filtered = customers.filter(c =>
                c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                c.phone.includes(searchTerm)
            );

            return (
                <div className="max-w-6xl mx-auto space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <div>
                            <h2 className="text-2xl font-bold text-stone-800">รายชื่อสมาชิกทั้งหมด</h2>
                            <p className="text-xs text-stone-400 mt-0.5">รวมสมาชิกทั้งหมด {customers.length} คน</p>
                        </div>

                        <div className="relative w-full sm:w-72">
                            <i data-lucide="search" className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
                            <input
                                type="text"
                                placeholder="ค้นหาชื่อ หรือ เบอร์โทร..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full bg-stone-100 border-none rounded-2xl pl-10 pr-4 py-2.5 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filtered.map(customer => (
                            <div
                                key={customer.id}
                                onClick={() => onSelectCustomer(customer)}
                                className="bg-white p-5 rounded-3xl shadow-sm border border-stone-100 hover:shadow-md transition-all cursor-pointer flex flex-col justify-between space-y-4 hover:border-amber-200 group"
                            >
                                <div className="flex justify-between items-start">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-10 h-10 rounded-2xl bg-stone-100 text-stone-700 font-bold flex items-center justify-center group-hover:bg-amber-100 group-hover:text-amber-800 transition-colors">
                                            {customer.name.slice(0, 2)}
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-stone-800">{customer.name}</h3>
                                            <p className="text-xs text-stone-400 font-medium">{formatPhone(customer.phone)}</p>
                                        </div>
                                    </div>
                                    <span className="px-3 py-1 bg-amber-50 text-amber-700 text-xs font-bold rounded-xl border border-amber-200">
                                        {customer.points} แต้ม
                                    </span>
                                </div>

                                <div className="flex justify-between items-center text-xs text-stone-400 pt-3 border-t border-stone-50">
                                    <span>สะสมแล้วทั้งหมด: {customer.totalEarned}</span>
                                    <span>ใช้งานล่าสุด: {customer.lastVisit ? customer.lastVisit.split(' ')[0] : '-'}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function HistoryView({ history, formatPhone }) {
            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <h2 className="text-2xl font-bold text-stone-800">ประวัติการทำรายการ</h2>
                        <p className="text-xs text-stone-400 mt-0.5">รายการสะสมและแลกแต้มย้อนหลัง</p>
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-stone-100 overflow-hidden">
                        <div className="divide-y divide-stone-100">
                            {history.map(item => (
                                <div key={item.id} className="p-4 sm:p-5 flex items-center justify-between hover:bg-stone-50 transition-colors">
                                    <div className="flex items-center space-x-4">
                                        <div className={`w-10 h-10 rounded-2xl flex items-center justify-center text-white ${
                                            item.type === 'ADD' ? 'bg-amber-600' : 'bg-emerald-600'
                                        }`}>
                                            <i data-lucide={item.type === 'ADD' ? 'plus' : 'gift'} className="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <p className="font-bold text-stone-800 text-sm">{item.customerName}</p>
                                            <p className="text-xs text-stone-400">{formatPhone(item.phone)} • {item.note}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <span className={`font-bold text-sm ${item.type === 'ADD' ? 'text-amber-700' : 'text-emerald-700'}`}>
                                            {item.type === 'ADD' ? `+${item.amount}` : `-${item.amount}`} แต้ม
                                        </span>
                                        <p className="text-[11px] text-stone-400">{item.time}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function SettingsView({ rewards, setRewards, showToast }) {
            const [newRewardName, setNewRewardName] = useState('');
            const [newRewardPts, setNewRewardPts] = useState('');

            const handleAddReward = (e) => {
                e.preventDefault();
                if (!newRewardName || !newRewardPts) return;
                const newR = {
                    id: 'r_' + Date.now(),
                    name: newRewardName,
                    pointsRequired: parseInt(newRewardPts, 10),
                    icon: 'gift'
                };
                setRewards([...rewards, newR]);
                setNewRewardName('');
                setNewRewardPts('');
                showToast('เพิ่มรายการของรางวัลสำเร็จ');
            };

            const handleDeleteReward = (id) => {
                setRewards(rewards.filter(r => r.id !== id));
                showToast('ลบของรางวัลเรียบร้อยแล้ว');
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <h2 className="text-2xl font-bold text-stone-800">จัดการของรางวัล</h2>
                        <p className="text-xs text-stone-400 mt-0.5">กำหนดรายการและจำนวนแต้มที่ใช้แลก</p>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-stone-100">
                        <h3 className="font-bold text-stone-800 mb-4 text-sm uppercase tracking-wider text-stone-500">
                            + เพิ่มของรางวัลใหม่
                        </h3>
                        <form onSubmit={handleAddReward} className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                            <input
                                type="text"
                                placeholder="ชื่อของรางวัล (เช่น ฟรี ชาเขียวเย็น 1 แก้ว)"
                                value={newRewardName}
                                onChange={(e) => setNewRewardName(e.target.value)}
                                required
                                className="sm:col-span-7 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <input
                                type="number"
                                placeholder="จำนวนแต้ม"
                                value={newRewardPts}
                                onChange={(e) => setNewRewardPts(e.target.value)}
                                required
                                min="1"
                                className="sm:col-span-3 bg-stone-100 border-none rounded-2xl px-4 py-3 text-sm text-stone-800 focus:ring-2 focus:ring-amber-500 outline-none"
                            />
                            <button
                                type="submit"
                                className="sm:col-span-2 bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-2xl text-sm transition-all shadow-md shadow-amber-600/20 active:scale-95"
                            >
                                เพิ่มรางวัล
                            </button>
                        </form>
                    </div>

                    <div className="space-y-3">
                        {rewards.map(reward => (
                            <div key={reward.id} className="bg-white p-5 rounded-3xl shadow-sm border border-stone-100 flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center">
                                        <i data-lucide="gift" className="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-stone-800 text-sm">{reward.name}</h4>
                                        <span className="text-xs text-amber-700 font-semibold">{reward.pointsRequired} แต้มสะสม</span>
                                    </div>
                                </div>
                                <button
                                    onClick={() => handleDeleteReward(reward.id)}
                                    className="p-2.5 text-stone-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all"
                                >
                                    <i data-lucide="trash-2" className="w-5 h-5"></i>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
